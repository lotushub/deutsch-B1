<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klar Deutsch · Your B1 learning studio</title><style>
:root{--ink:#18372e;--green:#17634b;--lime:#def2a4;--paper:#f7f8f3;--line:#dce2d7;--muted:#63716a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,textarea{font:inherit}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a46a00;outline-offset:3px}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 17px}button:hover{border-color:var(--green)}.primary{background:var(--green);color:white;border-color:var(--green)}header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#fff}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{background:var(--green);color:white;border-radius:10px;padding:5px 10px;margin-right:10px;font-size:19px}.badge{font-size:12px;letter-spacing:1px;text-transform:uppercase;background:#edf2e8;padding:6px 12px;border-radius:20px}.layout{display:grid;grid-template-columns:235px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 82px)}aside{padding:35px 22px;border-right:1px solid var(--line)}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;border-color:transparent}nav button.active{background:#e5eddf;color:var(--green);font-weight:700}.aside-note{font-size:13px;color:var(--muted);margin:36px 12px}.small{font-size:13px;color:var(--muted)}main{padding:40px 5%;min-width:0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:var(--green)}h1{font-size:clamp(32px,4vw,54px);line-height:1.1;letter-spacing:-2px;margin:12px 0 20px}h2{font-size:24px;letter-spacing:-.6px}h3{line-height:1.3}p{max-width:760px}.hero{background:#e9efdf;border:1px solid #d9e4cb;padding:35px;border-radius:20px;position:relative;overflow:hidden}.hero p{max-width:530px;color:#4a6052}.hero .badge{background:var(--lime)}.hero-art{position:absolute;right:35px;bottom:30px;font-size:76px;opacity:.15;font-weight:900;transform:rotate(-10deg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:23px 0 30px}.stat{padding:20px;background:white;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:28px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);padding:25px;border-radius:13px;text-align:left;display:block;width:100%;transition:transform .15s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #18372e0a}.card h3{margin:13px 0}.card p{font-size:14px;color:var(--muted)}.card-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--green);margin-top:23px}.num{display:inline-flex;width:35px;height:35px;border-radius:50%;background:#f0f3e9;align-items:center;justify-content:center;font-size:13px}.search{width:100%;padding:13px 17px;border:1px solid var(--line);border-radius:10px;margin:12px 0 20px;background:white}.panel{background:white;padding:30px;border:1px solid var(--line);border-radius:15px;margin:20px 0}.example{border-left:4px solid var(--green);background:#f0f5e8;padding:20px;margin-top:25px}.example p{margin:5px 0}.question{padding:22px 0;border-bottom:1px solid var(--line)}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:12px}label.option{display:block;margin:8px 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer}label.option:has(input:checked){background:#edf4e4;border-color:var(--green)}input[type=radio]{margin-right:10px;accent-color:var(--green)}.feedback{margin-top:12px;font-size:14px;padding:12px;border-radius:8px;background:#f3eee1}.feedback.good{background:#e8f2dc}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.flash{text-align:center;padding:45px 20px;min-height:260px}.flash h2{font-size:32px}.progress{height:7px;background:#e5eadf;border-radius:10px;overflow:hidden}.progress div{height:100%;background:var(--green)}textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:10px;padding:18px}footer{font-size:12px;color:var(--muted);margin-top:45px;padding-top:20px;border-top:1px solid var(--line)}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{font-size:12px;background:#edf2e8;padding:4px 10px;border-radius:10px}a{color:var(--green)}details{margin-top:18px}summary{cursor:pointer;font-weight:650}@media(max-width:850px){.hero-art{display:none}.layout{grid-template-columns:185px 1fr}.grid{grid-template-columns:1fr}main{padding:28px 5%}.hero{padding:25px}}@media(max-width:600px){header{height:70px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}nav{display:flex;overflow:auto;gap:2px}nav button{white-space:nowrap;font-size:14px;padding:9px 12px}.aside-note{display:none}.stats{gap:8px}.stat{padding:13px;font-size:12px}.stat strong{font-size:24px}.panel{padding:20px}.section-head{align-items:flex-start}h1{letter-spacing:-1px}header .small{display:none}}
</style></head><body><header><div class="brand"><span>K.</span>Klar Deutsch</div><div class="row"><span class="small">A little practice. Every day.</span><span class="badge">Level B1</span></div></header><div class="layout"><aside><nav aria-label="Learning sections" id="nav"></nav><div class="aside-note"><b>Your own learning space.</b><p>English explanations.<br>Real-life German.<br>One step at a time.</p><div class="progress"><div id="sideprogress"></div></div><p id="sidecount"></p><p id="storageNote">Progress stays in this browser.</p></div></aside><main id="main"></main></div><script>
const DATA={"lessons": [{"title": "weil, dass & obwohl", "cat": "Grammar", "rule": "Subordinate clauses send the conjugated verb to the end. Use weil for a reason, dass for reported content, and obwohl for a contrast. Separate the clauses with a comma.", "example": "Ich lerne Deutsch, weil ich in Zürich arbeite.", "translation": "I am learning German because I work in Zurich.", "questions": [{"q": "Ich bleibe zu Hause, weil ich krank ___.", "options": ["bin", "ist", "sein"], "answer": 0, "why": "The subject ich takes bin. The verb goes at the end of the weil clause."}, {"q": "___ es regnet, gehen wir spazieren.", "options": ["Weil", "Obwohl", "Dass"], "answer": 1, "why": "Obwohl expresses contrast: we go for a walk although it is raining."}, {"q": "Ich glaube, dass er morgen ___.", "options": ["kommt", "kommen", "kommst"], "answer": 0, "why": "Er takes kommt, placed at the end of the dass clause."}]}, {"title": "Relative clauses", "cat": "Grammar", "rule": "A relative clause describes a noun. Its verb goes last. Gender and number come from the noun; the case comes from the pronoun’s role inside the relative clause. Dative plural uses denen.", "example": "Das ist der Mann, dem ich geholfen habe.", "translation": "That is the man whom I helped.", "questions": [{"q": "Die Frau, ___ hier wohnt, ist Ärztin.", "options": ["der", "die", "den"], "answer": 1, "why": "Frau is feminine and the relative pronoun is the subject: die."}, {"q": "Das ist der Film, ___ ich gesehen habe.", "options": ["der", "dem", "den"], "answer": 2, "why": "Film is masculine and is the object of gesehen: accusative den."}, {"q": "Die Leute, mit ___ ich arbeite, sind nett.", "options": ["denen", "die", "deren"], "answer": 0, "why": "Mit requires dative. The dative plural relative pronoun is denen."}]}, {"title": "Konjunktiv II: wishes & politeness", "cat": "Grammar", "rule": "Use würde + infinitive for many hypothetical actions. Common forms include hätte (haben), wäre (sein), and könnte (können). These forms also make requests more polite.", "example": "Wenn ich mehr Zeit hätte, würde ich öfter lesen.", "translation": "If I had more time, I would read more often.", "questions": [{"q": "___ Sie mir bitte helfen?", "options": ["Könnten", "Können würde", "Könntest"], "answer": 0, "why": "Könnten Sie is a polite request with formal Sie."}, {"q": "Wenn ich reich ___, würde ich reisen.", "options": ["bin", "wäre", "war"], "answer": 1, "why": "An unreal condition uses wäre."}, {"q": "Ich würde gern in Berlin ___.", "options": ["wohne", "wohnen", "gewohnt"], "answer": 1, "why": "Würde combines with an infinitive at the end."}]}, {"title": "Passive voice", "cat": "Grammar", "rule": "The process passive focuses on an action: werden + past participle. The form of werden changes with the subject and tense. The agent can be introduced with von + dative.", "example": "Die Fahrräder werden in der Werkstatt repariert.", "translation": "The bicycles are being repaired in the workshop.", "questions": [{"q": "Das Paket ___ morgen geliefert.", "options": ["wird", "werden", "hat"], "answer": 0, "why": "Das Paket is singular, so use wird + geliefert."}, {"q": "Die Fenster werden ___.", "options": ["putzen", "geputzt", "geputzen"], "answer": 1, "why": "The passive needs the past participle geputzt."}, {"q": "Der Brief ___ gestern geschrieben.", "options": ["wird", "wurde", "werden"], "answer": 1, "why": "Gestern calls for a past form here: wurde geschrieben."}]}, {"title": "Past tenses in everyday stories", "cat": "Grammar", "rule": "In conversation, use Perfekt for many completed events. Movement to a destination often takes sein; most other verbs take haben. Sein, haben and modal verbs commonly use Präteritum. Plusquamperfekt describes an earlier past event.", "example": "Nachdem ich gegessen hatte, bin ich zum Kurs gefahren.", "translation": "After I had eaten, I went to the course.", "questions": [{"q": "Gestern ___ wir nach Bern gefahren.", "options": ["haben", "sind", "werden"], "answer": 1, "why": "Fahren with a destination uses sein in the Perfekt."}, {"q": "Ich ___ gestern keine Zeit.", "options": ["hatte", "hätte", "haben"], "answer": 0, "why": "Hatte is the Präteritum of haben."}, {"q": "Als er ankam, ___ ich schon gekocht.", "options": ["habe", "hatte", "bin"], "answer": 1, "why": "Cooking happened before his arrival: hatte gekocht."}]}, {"title": "Adjective endings", "cat": "Grammar", "rule": "Adjectives before nouns take endings. After a definite article, use -e in nominative singular and accusative feminine/neuter; most other forms take -en. After ein, the adjective may need to show gender itself.", "example": "Ich suche eine ruhige Wohnung mit einem kleinen Balkon.", "translation": "I am looking for a quiet flat with a small balcony.", "questions": [{"q": "Ich kaufe den rot___ Mantel.", "options": ["e", "en", "er"], "answer": 1, "why": "After den in masculine accusative, the adjective takes -en."}, {"q": "Das ist ein schön___ Haus.", "options": ["es", "e", "en"], "answer": 0, "why": "Ein does not show neuter gender here; schönes supplies the ending."}, {"q": "Mit einer nett___ Kollegin lerne ich Deutsch.", "options": ["e", "er", "en"], "answer": 2, "why": "After einer in dative feminine, use netten."}]}, {"title": "Two-way prepositions", "cat": "Grammar", "rule": "An, auf, hinter, in, neben, über, unter, vor and zwischen use accusative for a destination and dative for a location. Ask wohin? for a destination and wo? for a location.", "example": "Ich stelle die Tasche auf den Tisch. Sie steht jetzt auf dem Tisch.", "translation": "I put the bag onto the table. It is now on the table.", "questions": [{"q": "Das Bild hängt an ___ Wand.", "options": ["die", "der", "den"], "answer": 1, "why": "A fixed location uses dative: an der Wand."}, {"q": "Ich gehe in ___ Küche.", "options": ["der", "die", "den"], "answer": 1, "why": "The kitchen is the destination: in die Küche."}, {"q": "Wir sitzen auf ___ Balkon.", "options": ["dem", "den", "der"], "answer": 0, "why": "Sitzen describes a location: auf dem Balkon."}]}, {"title": "Infinitives with zu", "cat": "Grammar", "rule": "Use zu + infinitive after expressions such as versuchen and es ist wichtig. With separable verbs, place zu between prefix and stem. Um ... zu expresses a purpose when both clauses have the same subject; damit can introduce a different subject.", "example": "Ich lerne jeden Tag, um die Prüfung zu bestehen.", "translation": "I study every day in order to pass the exam.", "questions": [{"q": "Ich versuche, früh ___.", "options": ["aufzustehen", "zu aufstehen", "aufstehen zu"], "answer": 0, "why": "The separable verb aufstehen becomes aufzustehen."}, {"q": "Sie spart Geld, ___ ein Fahrrad zu kaufen.", "options": ["damit", "um", "weil"], "answer": 1, "why": "A shared subject and purpose use um ... zu."}, {"q": "Ich spreche langsam, damit du mich besser ___.", "options": ["verstehen", "zu verstehen", "verstehst"], "answer": 2, "why": "Damit introduces a finite subordinate clause: du verstehst."}]}, {"title": "Connectors & word order", "cat": "Grammar", "rule": "Deshalb and trotzdem occupy a position in the main clause; when they come first, the conjugated verb comes second and the subject follows. Weil and obwohl introduce subordinate clauses with the verb at the end.", "example": "Ich bin müde. Trotzdem mache ich meine Hausaufgaben.", "translation": "I am tired. Nevertheless, I am doing my homework.", "questions": [{"q": "Es regnet. Deshalb ___ ich zu Hause.", "options": ["bleibe", "ich bleibe", "bleiben"], "answer": 0, "why": "Deshalb occupies position one; bleibe is position two."}, {"q": "Er ist krank. ___ geht er zur Arbeit.", "options": ["Deshalb", "Trotzdem", "Weil"], "answer": 1, "why": "Going to work despite illness is a contrast: trotzdem."}, {"q": "Ich lerne, ___ ich die Prüfung bestehen möchte.", "options": ["deshalb", "weil", "trotzdem"], "answer": 1, "why": "The verb-final clause is introduced by weil."}]}, {"title": "Verbs with prepositions", "cat": "Grammar", "rule": "Learn fixed combinations together with the required case: warten auf + accusative, teilnehmen an + dative, sich interessieren für + accusative. For things, use worauf/darauf; for people, use auf wen/auf ihn.", "example": "Ich freue mich auf den Urlaub.", "translation": "I am looking forward to the holiday.", "questions": [{"q": "Ich warte ___ den Bus.", "options": ["auf", "für", "an"], "answer": 0, "why": "The fixed combination is warten auf + accusative."}, {"q": "Sie nimmt an ___ Kurs teil.", "options": ["den", "dem", "der"], "answer": 1, "why": "Teilnehmen an requires dative: an dem Kurs."}, {"q": "___ interessierst du dich? – Für Musik.", "options": ["Wofür", "Womit", "Woran"], "answer": 0, "why": "Sich interessieren für becomes wofür when asking about a thing."}]}, {"title": "A new start in Leipzig", "cat": "Reading", "rule": "Read for the main idea first, then find evidence for each answer. You do not need to translate every word.", "example": "Seit drei Monaten wohnt Sara in Leipzig. Früher fuhr sie mit dem Auto zur Arbeit. Jetzt nimmt sie die Straßenbahn, weil sie Geld sparen möchte. Ihre neue Wohnung ist kleiner als die alte, aber sie liegt näher am Büro. Am Samstag trifft Sara ihre Nachbarin im Park. Zusammen wollen sie einen Sprachkurs suchen. Sara spricht schon gut Deutsch, möchte aber beim Telefonieren sicherer werden.", "translation": "Sara moved to Leipzig three months ago. She now travels by tram to save money. Her smaller flat is closer to work. She and her neighbour plan to find a language course so Sara can feel more confident on the phone.", "questions": [{"q": "Warum fährt Sara mit der Straßenbahn?", "options": ["Sie möchte Geld sparen.", "Ihr Auto ist kaputt.", "Sie arbeitet im Park."], "answer": 0, "why": "The text states: weil sie Geld sparen möchte."}, {"q": "Was ist ein Vorteil der neuen Wohnung?", "options": ["Sie ist größer.", "Sie liegt näher am Büro.", "Sie kostet nichts."], "answer": 1, "why": "The flat is smaller, but closer to the office."}, {"q": "Was möchte Sara verbessern?", "options": ["Kochen", "Autofahren", "Telefonieren auf Deutsch"], "answer": 2, "why": "She wants to feel more confident when making phone calls."}]}, {"title": "An appointment change", "cat": "Listening", "rule": "Listen before revealing the transcript. The audio uses your browser’s German text-to-speech voice, when available. Listen for the date, time and action you need to take.", "example": "Guten Tag, Frau Keller. Hier ist die Praxis von Dr. Braun. Leider müssen wir Ihren Termin am Dienstag verschieben, weil die Ärztin krank ist. Wir können Ihnen stattdessen einen Termin am Donnerstag um vierzehn Uhr dreißig anbieten. Bitte rufen Sie uns bis morgen Mittag zurück. Bringen Sie zum Termin Ihre Versicherungskarte und die Liste Ihrer Medikamente mit. Vielen Dank.", "translation": "The practice needs to move Tuesday’s appointment because the doctor is ill. They offer Thursday at 2:30 pm. Mrs Keller should call back by tomorrow noon and bring her insurance card and medication list.", "questions": [{"q": "Wann ist der neue Termin?", "options": ["Dienstag um 14:30", "Donnerstag um 14:30", "Donnerstag um 16:30"], "answer": 1, "why": "The message offers Donnerstag um vierzehn Uhr dreißig."}, {"q": "Bis wann soll Frau Keller zurückrufen?", "options": ["Bis heute Abend", "Bis nächste Woche", "Bis morgen Mittag"], "answer": 2, "why": "The deadline is tomorrow at noon."}, {"q": "Was soll sie mitbringen?", "options": ["Versicherungskarte und Medikamentenliste", "Reisepass und Foto", "Nur Bargeld"], "answer": 0, "why": "The message asks for the insurance card and a list of medications."}]}], "vocab": [["die Bewerbung, -en", "job application", "Ich habe meine Bewerbung abgeschickt."], ["die Erfahrung, -en", "experience", "Ich habe Erfahrung im Verkauf."], ["sich bewerben um (+ Akk.)", "to apply for", "Ich bewerbe mich um eine Stelle."], ["der Termin, -e", "appointment", "Ich möchte einen Termin vereinbaren."], ["verschieben", "to reschedule", "Können wir den Termin verschieben?"], ["die Überweisung, -en", "bank transfer; medical referral", "Die Ärztin gibt mir eine Überweisung."], ["die Nebenkosten (Pl.)", "additional housing costs", "Sind die Nebenkosten im Preis enthalten?"], ["der Mietvertrag, -verträge", "rental agreement", "Ich unterschreibe den Mietvertrag."], ["sich kümmern um (+ Akk.)", "to take care of", "Ich kümmere mich um die Anmeldung."], ["zuverlässig", "reliable", "Meine Kollegin ist sehr zuverlässig."], ["die Voraussetzung, -en", "prerequisite", "Welche Voraussetzungen gibt es?"], ["vereinbaren", "to arrange", "Wir vereinbaren einen neuen Termin."], ["die Verspätung, -en", "delay", "Der Zug hat zwanzig Minuten Verspätung."], ["umsteigen", "to change trains/buses", "In Bern müssen wir umsteigen."], ["die Entscheidung, -en", "decision", "Das ist eine wichtige Entscheidung."], ["sich entscheiden für (+ Akk.)", "to decide on", "Ich entscheide mich für den Abendkurs."], ["die Umwelt", "environment", "Wir möchten die Umwelt schützen."], ["vermeiden", "to avoid", "Ich versuche, Plastik zu vermeiden."], ["die Beschwerde, -n", "complaint", "Ich möchte eine Beschwerde schreiben."], ["trotzdem", "nevertheless", "Es regnet. Trotzdem gehen wir hinaus."]]};
const {lessons,vocab}=DATA;let memory={};let storageOK=true;try{memory=JSON.parse(localStorage.getItem('klar-b1')||'{}')}catch{storageOK=false}let state=memory&&typeof memory==='object'&&!Array.isArray(memory)?memory:{};state.scores=state.scores||{};state.known=Array.isArray(state.known)?state.known:[];let section='Home',current=-1,word=0,revealed=false;
const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('klar-b1',JSON.stringify(state))}catch{storageOK=false}updateNav()}
function complete(i){return state.scores[i]===lessons[i].questions.length}
function updateNav(){document.getElementById('nav').innerHTML=['Home','Grammar','Reading','Listening','Vocabulary','Writing','My progress'].map((n,i)=>`<button class="${section===n?'active':''}" ${section===n?'aria-current="page"':''} onclick="go('${n}')">${['◈','Aa','▤','♫','◇','✎','◷'][i]} &nbsp;${n}</button>`).join('');let n=lessons.filter((_,i)=>complete(i)).length;document.getElementById('sideprogress').style.width=n/lessons.length*100+'%';document.getElementById('sidecount').textContent=`${n} / ${lessons.length} lessons mastered`;document.getElementById('storageNote').textContent=storageOK?'Progress stays in this browser.':'Storage unavailable: progress lasts for this session.'}
function foot(){return '<footer>Original B1-focused practice · Not an official exam or a complete B1 course · No account or external libraries required. Inspired by topic-based learning; not affiliated with Lingolia.</footer>'}
function go(n){if('speechSynthesis'in window)speechSynthesis.cancel();section=n;current=-1;updateNav();render();window.scrollTo(0,0)}
function cards(list){return `<div class="grid" id="cards">${list.map(l=>{let i=lessons.indexOf(l);return `<button class="card" data-title="${esc(l.title.toLowerCase())}" onclick="openLesson(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span> <span class="pill">${l.cat}</span><h3>${esc(l.title)}</h3><p>${esc(l.rule.split('. ')[0])}.</p><div class="card-foot"><span>${complete(i)?'✓ Mastered':state.scores[i]!=null?'Best: '+state.scores[i]+'/3':'3 practice questions · 8–12 min'}</span><span>Open lesson ↗</span></div></button>`}).join('')}</div>`}
function render(){if(section==='Home'){let next=lessons.findIndex((_,i)=>!complete(i));if(next<0)next=0;main.innerHTML=`<div class="hero"><span class="badge">Your B1 learning studio</span><h1>Make German part<br>of your everyday.</h1><p>Understand the rules. Put them into practice. Build the confidence to use German beyond the textbook.</p><button class="primary" onclick="openLesson(${next})">${Object.keys(state.scores).length?'Continue learning':'Start your first lesson'} →</button><div class="hero-art" aria-hidden="true">Hallo!</div></div><div class="stats"><div class="stat"><strong>${lessons.filter((_,i)=>complete(i)).length}<span class="small"> / 12</span></strong>Lessons mastered</div><div class="stat"><strong>${state.known.length}<span class="small"> / 20</span></strong>Words learned</div><div class="stat"><strong>15 min</strong>Your daily practice idea</div></div><div class="section-head"><div><span class="eyebrow">Your learning path</span><h2>Small steps, stronger German.</h2></div><span class="small">Learn → practise → review</span></div>${cards(lessons.slice(0,4))}<div class="panel"><span class="eyebrow">A simple daily routine</span><p><b>5 minutes:</b> review vocabulary. <b>7 minutes:</b> read a grammar explanation and answer three questions. <b>3 minutes:</b> write two sentences using what you learned.</p><button onclick="go('Grammar')">Explore all grammar topics →</button></div>`}
else if(['Grammar','Reading','Listening'].includes(section)){let list=lessons.filter(l=>l.cat===section);main.innerHTML=`<span class="eyebrow">B1 · ${section}</span><h1>${section==='Grammar'?'Understand the patterns.':section==='Reading'?'Read with confidence.':'Tune in to German.'}</h1><p class="small">${section==='Grammar'?'Clear explanations, practical examples, and feedback for every answer.':section==='Reading'?'An everyday story with evidence-based comprehension questions.':'A practical voice message. Browser-generated speech; German voice availability depends on your device.'}</p><input class="search" aria-label="Search topics" placeholder="Search topics…" oninput="filterCards(this.value)">${cards(list)}<p id="empty" hidden>No matching topics. Try another word.</p>`}
else if(section==='Vocabulary')renderWords();else if(section==='Writing')renderWriting();else renderProgress();main.innerHTML+=foot()}
function filterCards(v){let n=0;document.querySelectorAll('#cards .card').forEach(c=>{c.hidden=!c.dataset.title.includes(v.toLowerCase());c.style.display=c.hidden?'none':'block';if(!c.hidden)n++});document.getElementById('empty').hidden=n>0}
function openLesson(i){current=i;state.last=i;save();let l=lessons[i];section=l.cat;updateNav();let listen=l.cat==='Listening';main.innerHTML=`<button onclick="go('${l.cat}')">← All ${l.cat.toLowerCase()}</button><p class="eyebrow">Lesson ${i+1} · ${l.cat} · B1</p><h1>${esc(l.title)}</h1><div class="panel"><h2>${listen?'Listen to the message':l.cat==='Reading'?'Read the story':'The idea'}</h2><p>${esc(l.rule)}</p>${listen?`<div class="actions"><button class="primary" onclick="speak(${i})">▶ Listen in German</button><button onclick="speechSynthesis.cancel()">Stop</button></div><p id="audioStatus" role="status" class="small"></p><details><summary>Show German transcript</summary><p lang="de">${esc(l.example)}</p></details>`:`<div class="example"><p lang="de"><b>${esc(l.example)}</b></p></div>`}<details><summary>English ${l.cat==='Grammar'?'translation':'summary'}</summary><p>${esc(l.translation)}</p></details></div><form id="quiz" class="panel" novalidate><span class="eyebrow">Put it into practice</span><h2>${listen?'What did you hear?':'Check your understanding'}</h2>${l.questions.map((q,j)=>`<div class="question"><fieldset><legend>${j+1}. ${esc(q.q)}</legend>${q.options.map((o,k)=>`<label class="option" lang="de"><input type="radio" name="q${j}" value="${k}">${esc(o)}</label>`).join('')}</fieldset><button type="button" onclick="checkQuestion(${i},${j})">Check this answer</button><div id="f${j}" aria-live="polite"></div></div>`).join('')}<div class="actions"><button class="primary" type="submit">Check answers</button><button type="button" onclick="openLesson(${i})">Try again</button></div><p id="result" role="status"></p></form>${i<lessons.length-1?`<button onclick="openLesson(${i+1})">Next lesson →</button>`:''}${foot()}`;document.getElementById('quiz').onsubmit=e=>{e.preventDefault();checkQuiz(i)};window.scrollTo(0,0)}

function questionResult(i,j){
 const q=lessons[i].questions[j];
 const selected=document.querySelector('#quiz input[name="q'+j+'"]:checked');
 const target=document.getElementById('f'+j);
 if(!selected){target.innerHTML='<div class="feedback">Choose an answer for this question first.</div>';return null}
 const ok=Number(selected.value)===q.answer;
 target.innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ Correct':'Not quite. Correct answer: '+esc(q.options[q.answer])}</b><br>${esc(q.why)}</div>`;
 return ok;
}
function checkQuestion(i,j){questionResult(i,j);document.getElementById('result').textContent='Use “Check answers” to check the whole lesson and save your score.'}
function checkQuiz(i){
 const results=lessons[i].questions.map((_,j)=>questionResult(i,j));
 const answered=results.filter(x=>x!==null).length,score=results.filter(x=>x===true).length;
 const result=document.getElementById('result');
 if(answered!==results.length){result.textContent=`${score} correct out of ${answered} answered. Answer the remaining ${results.length-answered} question(s) to save your lesson score.`;return}
 state.scores[i]=Math.max(state.scores[i]||0,score);save();
 result.textContent=`${score} / ${results.length} correct. ${score===results.length?'Lesson mastered!':'Read the feedback and try again. Your best score is saved.'}`;
}

function speak(i){let status=document.getElementById('audioStatus');if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable in this browser. Please use the transcript.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessons[i].example);u.lang='de-DE';u.rate=.85;let voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('de'));if(voice)u.voice=voice;status.textContent='Playing browser-generated German speech…';u.onend=()=>status.textContent='Finished. Listen again or answer the questions.';u.onerror=()=>status.textContent='Audio is unavailable. Use the German transcript below.';speechSynthesis.speak(u)}
function renderWords(){let v=vocab[word];main.innerHTML=`<span class="eyebrow">Everyday language · 20 cards</span><h1>Words you’ll actually use.</h1><p>Learn each noun with its article and plural. Learn verbs with their prepositions.</p><div class="panel flash"><span class="pill">Card ${word+1} / ${vocab.length} ${state.known.includes(word)?'· ✓ Learned':''}</span><h2 lang="de">${esc(v[0])}</h2>${revealed?`<p>${esc(v[1])}</p><p lang="de"><i>${esc(v[2])}</i></p>`:'<p class="small">Can you recall the meaning?</p>'}<button class="primary" onclick="revealed=!revealed;renderWords()">${revealed?'Hide meaning':'Reveal meaning'}</button></div><div class="actions"><button onclick="moveWord(-1)">← Previous</button><button onclick="toggleKnown()">${state.known.includes(word)?'Mark for review':'✓ I know this word'}</button><button onclick="moveWord(1)">Next →</button></div><p class="small">${state.known.length} words marked learned. Use Previous and Next to review any card.</p>`}
function moveWord(n){word=(word+n+vocab.length)%vocab.length;revealed=false;renderWords()}function toggleKnown(){state.known=state.known.includes(word)?state.known.filter(x=>x!==word):[...state.known,word];save();renderWords()}
const prompts=[['Request a repair','You rent a flat. The heating has not worked since Monday. Write to your landlord: explain the problem, describe its effect, ask for a repair appointment, and say when you are available.'],['Change an appointment','You cannot attend a language-course appointment. Write a polite email: apologise, give a reason, suggest two alternatives, and ask for confirmation.'],['Share your opinion','Should more people cycle to work? State your opinion, give two reasons, mention a possible problem, and finish with a recommendation.']];
function renderWriting(){let p=Number(state.prompt)||0;main.innerHTML=`<span class="eyebrow">Writing workshop</span><h1>Find your own words.</h1><p>Aim for 80–100 words as a practice goal. Your draft saves in this browser. Use the checklist for self-review; there is no automatic language grading.</p><div class="row">${prompts.map((x,i)=>`<button class="${i===p?'primary':''}" onclick="state.prompt=${i};save();renderWriting()">${esc(x[0])}</button>`).join('')}</div><div class="panel"><h2>${esc(prompts[p][0])}</h2><p>${esc(prompts[p][1])}</p><label for="draft" class="small">Your German draft</label><textarea id="draft" lang="de" placeholder="Sehr geehrte Frau …" oninput="saveDraft(this.value)">${esc(state['draft'+p]||'')}</textarea><p id="wordcount" class="small"></p><details><summary>Useful phrases</summary><p lang="de">Ich schreibe Ihnen, weil …<br>Leider kann ich …<br>Wäre es möglich, …?<br>Meiner Meinung nach …<br>Einerseits …, andererseits …<br>Ich freue mich auf Ihre Antwort.<br>Mit freundlichen Grüßen</p></details></div><div class="panel"><h2>Review your draft</h2>${['I covered every point in the prompt.','My greeting and tone fit the reader.','My conjugated verbs are in the right position.','I checked articles, cases and adjective endings.','I connected ideas with weil, obwohl or deshalb.'].map(t=>`<label style="display:block;margin:12px 0"><input type="checkbox"> ${t}</label>`).join('')}<button onclick="downloadDraft()">Download my draft</button></div>`;countWords(state['draft'+p]||'')}
function countWords(v){document.getElementById('wordcount').textContent=`${v.trim()?v.trim().split(/\s+/).length:0} words · Practice goal: 80–100`}
function saveDraft(v){state['draft'+(Number(state.prompt)||0)]=v;save();countWords(v)}
function downloadDraft(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([state['draft'+(Number(state.prompt)||0)]||''],{type:'text/plain;charset=utf-8'}));a.download='mein-deutscher-text.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderProgress(){main.innerHTML=`<span class="eyebrow">Your learning record</span><h1>See how far you’ve come.</h1><p>A lesson is mastered when you answer all three questions correctly. Your best score is retained.</p><div class="panel">${lessons.map((l,i)=>`<div class="section-head" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(l.title)}</span><button onclick="openLesson(${i})">${complete(i)?'✓ Mastered':state.scores[i]!=null?state.scores[i]+'/3 · Review':'Start →'}</button></div>`).join('')}</div><div class="panel"><h2>Back up your progress</h2><p>Export your scores, vocabulary marks and drafts before clearing browser data or changing devices. Import replaces the progress in this browser.</p><div class="actions"><button onclick="exportProgress()">Export progress</button><label class="option">Import progress <input type="file" accept=".json,application/json" onchange="importProgress(this)"></label></div><p id="backupStatus" role="status"></p><h2>Your next step</h2><p>Combine this practice with real conversations, longer reading, and feedback from a teacher or language partner.</p><button onclick="resetProgress()">Reset saved progress</button></div>`}

function exportProgress(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'klar-deutsch-b1',version:1,savedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'}));
 a.download='klar-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function validatedProgress(backup){
 if(!backup||backup.app!=='klar-deutsch-b1'||backup.version!==1)throw Error('Please choose a Klar Deutsch progress backup (version 1).');
 const p=backup.progress;
 if(!p||typeof p!=='object'||Array.isArray(p)||!p.scores||typeof p.scores!=='object'||Array.isArray(p.scores)||!Array.isArray(p.known))throw Error('This backup has invalid progress data.');
 const clean={scores:{},known:[]};
 for(const [key,value] of Object.entries(p.scores)){
  const i=Number(key);
  if(!Number.isInteger(i)||String(i)!==key||i<0||i>=lessons.length||!Number.isInteger(value)||value<0||value>lessons[i].questions.length)throw Error('This backup contains an invalid lesson score.');
  clean.scores[i]=value;
 }
 if(!p.known.every(i=>Number.isInteger(i)&&i>=0&&i<vocab.length))throw Error('This backup contains invalid vocabulary marks.');
 clean.known=[...new Set(p.known)];
 for(let i=0;i<3;i++){const key='draft'+i;if(p[key]!==undefined){if(typeof p[key]!=='string'||p[key].length>100000)throw Error('A writing draft is invalid or too long.');clean[key]=p[key]}}
 for(const [key,max] of [['prompt',3],['last',lessons.length]])if(p[key]!==undefined){if(!Number.isInteger(p[key])||p[key]<0||p[key]>=max)throw Error('This backup contains an invalid lesson selection.');clean[key]=p[key]}
 return clean;
}
async function importProgress(input){
 const status=document.getElementById('backupStatus'),file=input.files&&input.files[0];if(!file)return;
 try{
  if(file.size>1048576)throw Error('The backup must be smaller than 1 MB.');
  const clean=validatedProgress(JSON.parse(await file.text()));
  if(!confirm('Replace the saved progress and writing drafts in this browser with this backup?'))return;
  state=clean;save();renderProgress();
  document.getElementById('backupStatus').textContent=storageOK?'Progress restored successfully.':'Progress imported for this session, but browser storage is unavailable. Keep your backup file.';
 }catch(error){status.textContent='Import failed: '+error.message}
 input.value='';
}

function resetProgress(){if(confirm('Delete your lesson scores, vocabulary marks and writing drafts in this browser?')){state={scores:{},known:[]};save();render()}}
updateNav();render();
</script></body></html>
