kann man das Buch bis 18 Uhr abholen.", "options": ["Richtig", "Falsch"], "answer": 1, "why": "Thursday closing is exceptionally at 16:00."}, {"q": "Der Anschlussbus wartet auf die Reisenden.", "options": ["Richtig", "Falsch"], "answer": 0, "why": "The announcement explicitly says the bus will wait."}, {"q": "Paul möchte Lena um halb acht treffen.", "options": ["Richtig", "Falsch"], "answer": 0, "why": "Half an hour after seven is 7:30, halb acht."}, {"q": "Das Geschäft ist am Dienstag ebenfalls geschlossen.", "options": ["Richtig", "Falsch"], "answer": 1, "why": "Normal hours resume on Tuesday."}, {"q": "Die Medikamente sollen vor der Untersuchung genommen werden.", "options": ["Richtig", "Falsch"], "answer": 1, "why": "The message says to take them after the examination."}]}], "writing": [{"title": "Reply to a friend’s invitation", "register": "Informal · du", "input": "Dein Freund Jonas lädt dich zu seiner Geburtstagsfeier am Samstag in einer anderen Stadt ein. Er fragt, ob du kommen kannst und ob du bei ihm übernachten möchtest.", "points": ["Bedanke dich und reagiere auf die Einladung.", "Erkläre, wann und wie du anreisen möchtest.", "Frage, was du zur Feier mitbringen kannst.", "Antworte auf das Angebot zur Übernachtung."]}, {"title": "Ask about a course", "register": "Semi-formal · Sie", "input": "Du interessierst dich für einen Wochenendkurs zur Prüfungsvorbereitung. Schreibe an die Kursleiterin Frau Engel.", "points": ["Erkläre, warum du dich für den Kurs interessierst.", "Beschreibe deine bisherigen Deutschkenntnisse.", "Frage nach Terminen und Kosten.", "Bitte um Informationen zu den Kursmaterialien."]}, {"title": "Arrange a visit", "register": "Informal · du", "input": "Deine Freundin Sofia möchte dich am nächsten Wochenende besuchen. Sie fragt nach Ausflügen, Unterkunft und dem Wetter.", "points": ["Reagiere auf den geplanten Besuch.", "Schlage eine gemeinsame Aktivität vor und begründe sie.", "Erkläre, wo Sofia übernachten kann.", "Gib einen Tipp zu Kleidung oder Wetter."]}, {"title": "Request a replacement appointment", "register": "Semi-formal · Sie", "input": "Du hast einen Beratungstermin bei Herrn Krüger, kannst aber nicht kommen. Schreibe eine Nachricht.", "points": ["Bedanke dich für den vereinbarten Termin.", "Erkläre, warum du nicht kommen kannst.", "Schlage zwei andere Termine vor.", "Bitte um eine Bestätigung."]}], "speaking": [{"title": "Part 1 · Get to know each other", "brief": "Exchange information with your partner. Give short connected answers and ask follow-up questions; do not deliver a memorised speech.", "a": ["Name und Herkunft", "Wohnort und Wohnung", "Beruf oder Ausbildung", "Sprachen und Gründe fürs Deutschlernen", "Freizeit und Interessen"], "b": ["Seit wann wohnst du hier?", "Was gefällt dir an deiner Arbeit?", "Wie lernst du am liebsten Deutsch?", "Was machst du am Wochenende?"]}, {"title": "Part 2 · Public transport or a car?", "brief": "Each partner reads a different opinion. Summarise your person’s view, then exchange your own experiences and opinions.", "a": ["Mira, 29: Ich fahre mit der Bahn zur Arbeit. Dabei kann ich lesen. Manchmal ist der Zug unpünktlich, aber ein eigenes Auto wäre mir zu teuer."], "b": ["Daniel, 42: Ich brauche das Auto, weil ich früh anfange und auf dem Land wohne. Ich würde gern weniger fahren, aber morgens gibt es keinen passenden Bus."]}, {"title": "Part 2 · Shopping online or locally?", "brief": "Summarise the opinion on your card. Explain your own position, respond to your partner and give an example.", "a": ["Lea, 25: Ich bestelle viel im Internet. Ich kann Preise vergleichen und muss nach der Arbeit nicht mehr einkaufen gehen. Rücksendungen versuche ich zu vermeiden."], "b": ["Omar, 37: Ich kaufe lieber in kleinen Geschäften. Dort kann ich Fragen stellen und die Waren ansehen. Mir ist wichtig, dass es in meinem Viertel noch Läden gibt."]}, {"title": "Part 3 · Plan a study day", "brief": "Your course wants to organise a study day before the German exam. Reach decisions together rather than listing unrelated ideas.", "a": ["Wann und wo treffen Sie sich?", "Was üben Sie zuerst?", "Welche Materialien brauchen Sie?", "Wer bringt Essen und Getränke mit?", "Wie helfen Sie Personen, die später kommen?"], "b": ["Schlage eine konkrete Zeit vor.", "Frage nach der Meinung deiner Partnerin oder deines Partners.", "Reagiere auf einen Vorschlag und begründe eine Alternative.", "Fasse am Ende zusammen, wer was übernimmt."]}, {"title": "Part 3 · Help a friend move", "brief": "A friend is moving next Saturday. You and your partner want to help organise the move.", "a": ["Treffpunkt und Zeit", "Transport und Kartons", "Weitere Helfer", "Essen und Pausen", "Aufgabenverteilung"], "b": ["Ich könnte den Transporter organisieren.", "Was hältst du davon, wenn wir ...?", "Das passt mir leider nicht, weil ...", "Dann machen wir es so: ..."]}]};
const EXAM_MODELS=["Lieber Jonas,\nvielen Dank für deine Einladung! Ich komme sehr gern zu deiner Geburtstagsfeier. Es ist lange her, dass wir uns gesehen haben, und ich freue mich auf dich und deine Freunde.\nIch möchte am Samstag mit dem Zug anreisen. Wahrscheinlich komme ich gegen drei Uhr am Bahnhof an. Passt dir diese Zeit? Falls du noch Hilfe bei den Vorbereitungen brauchst, kann ich auch früher kommen.\nWas soll ich zur Feier mitbringen? Ich könnte einen Kuchen backen oder Getränke besorgen. Sag mir bitte Bescheid, was dir lieber ist.\nVielen Dank auch für das Angebot zur Übernachtung. Das nehme ich gern an, weil ich dann abends nicht auf den letzten Zug achten muss.\nLiebe Grüße\nAlex", "Sehr geehrte Frau Engel,\nich habe Ihre Anzeige für den Wochenendkurs gelesen und interessiere mich dafür. In vier Wochen möchte ich die Prüfung telc Deutsch B1 ablegen. Deshalb suche ich einen Kurs, in dem ich die Prüfungsteile gezielt üben kann.\nIch habe einen Deutschkurs auf Niveau A2 abgeschlossen und lerne seit einigen Wochen B1. Beim Schreiben und Sprechen brauche ich noch Unterstützung.\nKönnten Sie mir bitte mitteilen, an welchen Wochenenden der Kurs stattfindet und wie viel er kostet? Da ich samstags vormittags arbeite, wären die genauen Uhrzeiten für mich wichtig.\nAußerdem möchte ich wissen, ob die Kursmaterialien im Preis enthalten sind oder ob ich ein Buch kaufen muss.\nVielen Dank für Ihre Antwort.\nMit freundlichen Grüßen\nAlex Weber", "Liebe Sofia,\nwie schön, dass du mich nächstes Wochenende besuchen möchtest! Ich habe am Samstag und Sonntag Zeit und freue mich schon sehr darauf.\nAm Samstag könnten wir am See spazieren gehen. Dort ist es ruhig, und es gibt ein kleines Café mit gutem Kuchen. Wenn es regnet, können wir stattdessen das Stadtmuseum besuchen. Was hältst du davon?\nDu kannst gern bei mir übernachten. Im Wohnzimmer gibt es ein bequemes Sofa. Du brauchst keine Bettwäsche mitzubringen, aber denk bitte an dein Handtuch.\nIm Moment ist es hier ziemlich kühl, besonders am Abend. Bring deshalb am besten eine warme Jacke und bequeme Schuhe mit.\nSchreib mir bitte noch, wann du ankommst.\nLiebe Grüße\nAlex", "Sehr geehrter Herr Krüger,\nvielen Dank, dass Sie mir einen Beratungstermin für den kommenden Dienstag gegeben haben.\nLeider kann ich diesen Termin nicht wahrnehmen, weil ich an diesem Tag kurzfristig länger arbeiten muss. Dafür bitte ich um Entschuldigung. Die Beratung ist mir weiterhin sehr wichtig, und ich würde gern einen neuen Termin vereinbaren.\nWäre es möglich, dass ich am Donnerstag nach 15 Uhr zu Ihnen komme? Alternativ hätte ich am Freitag zwischen 9 und 12 Uhr Zeit. Falls beide Vorschläge für Sie ungünstig sind, freue ich mich über einen anderen Termin in der nächsten Woche.\nKönnten Sie mir bitte kurz per E-Mail bestätigen, welcher Termin möglich ist?\nVielen Dank für Ihr Verständnis.\nMit freundlichen Grüßen\nAlex Weber"];
function examState(){if(!state.exam)state.exam={days:[],scores:{},drafts:{},mocks:[],minutes:90};return state.exam}
let clockHandle=null,clockRemaining=0,clockDeadline=0;
function clearExamClock(){if(clockHandle!==null){clearInterval(clockHandle);clockHandle=null}}
function clockBlock(minutes){clearExamClock();clockRemaining=minutes*60;return `<div class="exam-clock"><span class="eyebrow">Practice timer</span><strong id="clockDisplay">${minutes}:00</strong><div class="row"><button type="button" onclick="startExamClock()">Start / resume</button><button type="button" onclick="pauseExamClock()">Pause</button><button type="button" onclick="resetExamClock(${minutes})">Reset</button></div><p id="clockStatus" role="status" class="small">Timer resets when you leave this page. It does not submit answers automatically.</p></div>`}
function paintClock(){let el=document.getElementById('clockDisplay');if(el)el.textContent=Math.floor(clockRemaining/60)+':'+String(clockRemaining%60).padStart(2,'0')}
function startExamClock(){if(clockHandle!==null||clockRemaining<=0)return;clockDeadline=Date.now()+clockRemaining*1000;clockHandle=setInterval(()=>{clockRemaining=Math.max(0,Math.ceil((clockDeadline-Date.now())/1000));paintClock();if(clockRemaining===0){clearExamClock();let s=document.getElementById('clockStatus');if(s)s.textContent='Time is up. Stop working and review what you completed.'}},250);document.getElementById('clockStatus').textContent='Timer running. Practise without pausing when simulating an exam.'}
function pauseExamClock(){if(clockHandle!==null)clockRemaining=Math.max(0,Math.ceil((clockDeadline-Date.now())/1000));clearExamClock();paintClock();document.getElementById('clockStatus').textContent='Paused.'}
function resetExamClock(minutes){clearExamClock();clockRemaining=minutes*60;paintClock();document.getElementById('clockStatus').textContent='Timer reset.'}
function examHeader(label,title,desc){return `<span class="eyebrow">telc Deutsch B1 preparation · independent practice</span><h1>${esc(title)}</h1><p>${esc(desc)}</p><div class="row"><span class="badge">${esc(label)}</span><span class="badge">A2 → B1 · 4-week focus</span></div>`}
function renderExamHome(){const e=examState(),done=e.days.length;main.innerHTML=examHeader('Your exam dashboard','Prepare for the exam you’ll actually take.','A focused path for Zertifikat Deutsch / telc Deutsch B1: build the language, practise the task types, and check your performance with official material.')+`<div class="callout"><h3>Start with evidence, not a predicted pass</h3><p>Moving from A2 to exam-ready B1 in four weeks is demanding. Begin with the official mock test, get writing and speaking feedback from a teacher or partner, and use the results to choose what to practise. This site does not certify your level.</p></div><div class="stats"><div class="stat"><strong>${done} / 28</strong>Study days completed</div><div class="stat"><strong>${Object.keys(e.scores).length} / 8</strong>Exam drills attempted</div><div class="stat"><strong>${e.mocks.length}</strong>Official mock records</div></div><div class="grid">${[['Study plan','Your 28-day route','Daily tasks combining language review, exam practice and active speaking.'],['Exam practice','Practise all objective task types','60 original items across reading, language elements and listening.'],['Exam writing','Write to four guiding points','Four original email tasks, a 30-minute timer and a structured self-review.'],['Speaking','Practise the three speaking parts','Partner cards, follow-up questions and planning situations.'],['Mock companion','Use official telc materials offline','Open locally downloaded PDFs/audio, time your work and record assessed scores.'],['Resources','Official sources & grammar support','Verified telc links and Lingolia topic links. External websites need internet.']].map(([n,t,d])=>`<button class="card" onclick="go('${n}')"><span class="eyebrow">${n}</span><h3>${t} →</h3><p>${d}</p></button>`).join('')}</div><div class="panel"><h2>Know the structure</h2><div class="table-wrap"><table><thead><tr><th>Area</th><th>Tasks</th><th>Time</th></tr></thead><tbody><tr><td>Reading + language elements</td><td>3 reading parts + 2 language-element parts</td><td>90 minutes together</td></tr><tr><td>Listening</td><td>3 parts</td><td>Approximately 30 minutes</td></tr><tr><td>Writing</td><td>1 email with 4 guiding points</td><td>30 minutes</td></tr><tr><td>Speaking</td><td>3 parts, normally with a partner</td><td>Approximately 15 minutes, after 20 minutes preparation</td></tr></tbody></table></div><p class="small">Source: <a href="https://www.telc.net/en/language-examinations/certificate-exams/german/certificate-german-telc-german-b1/" target="_blank" rel="noopener">telc official exam page</a>. Checked 6 November 2026. Confirm your booked exam and delivery format with your examination centre.</p></div>`}

function renderStudyPlan(){const e=examState();main.innerHTML=examHeader('28-day plan','One day. A clear next step.','Use this as a suggested plan, not a guarantee. If your exam is sooner, prioritise the baseline, writing, speaking and weakest areas; do not rush through all lessons.')+`<div class="panel"><label for="dailyMinutes">My daily study budget</label> <select id="dailyMinutes" onchange="examState().minutes=Number(this.value);save();renderStudyPlan()">${[30,60,90,120].map(n=>`<option value="${n}" ${e.minutes===n?'selected':''}>${n} minutes</option>`).join('')}</select><p class="small">Suggested split: ${Math.round(e.minutes*.5)} min main task · ${Math.round(e.minutes*.3)} min speaking/writing · ${e.minutes-Math.round(e.minutes*.5)-Math.round(e.minutes*.3)} min review. Official full-test days need their actual exam time in addition to review; split them only when training, and record that condition.</p></div>${PLAN.map(([title,section,task,active],i)=>`<details class="panel" ${i===PLAN.findIndex((_,j)=>!e.days.includes(j))?'open':''}><summary>Day ${i+1} · ${esc(title)} ${e.days.includes(i)?'✓':''}</summary><p>${esc(task)}</p><p><b>Active language:</b> ${esc(active)}</p><div class="row"><button onclick="go('${section}')">Open ${section} →</button><button onclick="toggleDay(${i})">${e.days.includes(i)?'Mark unfinished':'Mark completed'}</button></div></details>`).join('')}`}
function toggleDay(i){const e=examState();e.days=e.days.includes(i)?e.days.filter(x=>x!==i):[...e.days,i];save();renderStudyPlan()}
function renderExamPractice(){const e=examState();main.innerHTML=examHeader('8 task drills · 60 original items','Practise the task, not just the rule.','These original exercises practise the standard objective task types. They are not an official mock test, not calibrated to telc difficulty, and not a pass prediction.')+`<div class="callout"><h3>Two ways to use a drill</h3><p>Learning mode: check individual answers and read the explanations. Practice mode: answer the whole drill first, then check. Listening uses browser-generated speech; use telc’s real recordings for authentic listening practice and playback timing.</p></div>${['Lesen','Sprachbausteine','Hören'].map(g=>`<section class="catalog-group"><h2>${g}</h2><div class="grid">${EXAM.drills.filter(d=>d.section===g).map(d=>`<button class="card" onclick="openExamDrill('${d.id}')"><h3>${esc(d.title)} →</h3><p>${d.questions.length} questions · original practice</p><span class="small">${e.scores[d.id]?`Latest complete attempt: ${e.scores[d.id].correct}/${d.questions.length}`:'Not completed yet'}</span></button>`).join('')}</div></section>`).join('')}`}
function openExamDrill(id){section='Exam practice';updateNav();const d=EXAM.drills.find(d=>d.id===id);if(!d)return;clearExamClock();main.innerHTML=`<button onclick="go('Exam practice')">← Exam practice</button>`+examHeader(d.section,d.title,d.intro)+(d.section==='Hören'?`<div class="panel"><div class="row"><button class="primary" onclick="speakExam('${id}')">Listen to the practice text</button><button onclick="stopExamAudio()">Stop</button></div><p id="examAudioStatus" role="status" class="small">Speech availability depends on your device. Use a locally installed German voice for offline audio.</p><details><summary>Show German transcript (review after listening)</summary><p class="reading-text" lang="de">${esc(d.text)}</p></details></div>`:d.text?`<div class="panel reading-text" lang="de">${esc(d.text)}</div>`:'')+`<form id="examDrill" class="panel" novalidate>${d.questions.map((q,j)=>`<div class="question"><fieldset><legend lang="de">${j+1}. ${esc(q.q)}</legend><select aria-label="Answer question ${j+1}" name="exam${j}" onchange="document.getElementById('examFeedback${j}').textContent=''" style="max-width:100%;width:100%"><option value="">Choose an answer…</option>${q.options.map((o,k)=>`<option value="${k}">${esc(o)}</option>`).join('')}</select></fieldset><button type="button" onclick="checkExamAnswer('${id}',${j})" style="margin-top:12px">Check this answer</button><div id="examFeedback${j}" aria-live="polite"></div></div>`).join('')}<div class="actions"><button class="primary" type="submit">Check complete drill</button><button type="button" onclick="openExamDrill('${id}')">Start again</button></div><p id="examResult" role="status"></p></form>`;document.getElementById('examDrill').onsubmit=e=>{e.preventDefault();checkExamDrill(id)};window.scrollTo(0,0)}
function checkExamAnswer(id,j){const d=EXAM.drills.find(d=>d.id===id),q=d.questions[j],input=document.querySelector('[name="exam'+j+'"]'),box=document.getElementById('examFeedback'+j);if(input.value===''){box.innerHTML='<div class="feedback">Choose an answer first.</div>';return null}const ok=Number(input.value)===q.answer;box.innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ Correct':'Correct answer: '+esc(q.options[q.answer])}</b><p>${esc(q.why)}</p></div>`;return ok}
function checkExamDrill(id){const d=EXAM.drills.find(d=>d.id===id),r=d.questions.map((_,j)=>checkExamAnswer(id,j)),answered=r.filter(x=>x!==null).length,correct=r.filter(x=>x===true).length;const status=document.getElementById('examResult');if(answered!==r.length){status.textContent=`${correct} correct from ${answered} answered. Complete the remaining ${r.length-answered} to save this attempt.`;return}if(d.kind==='matching'||d.kind==='wordbank'){const values=d.questions.map((_,j)=>document.querySelector('[name="exam'+j+'"]').value).filter(v=>!(d.id==='lesen3'&&Number(v)===12));if(new Set(values).size!==values.length){status.textContent='A heading, advert or word has been used more than once. Check the one-use instruction before saving.';return}}
 examState().scores[id]={correct,missed:r.flatMap((v,i)=>v?[]:[i]),date:new Date().toISOString()};save();status.textContent=`${correct} / ${r.length} correct. Latest attempt saved. This drill result is not an official exam score.`}
function stopExamAudio(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function speakExam(id){const status=document.getElementById('examAudioStatus');if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable. Use the transcript and the official audio resources.';return}stopExamAudio();const d=EXAM.drills.find(d=>d.id===id),u=new SpeechSynthesisUtterance(d.text);u.lang='de-DE';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('de')&&v.localService)||speechSynthesis.getVoices().find(v=>v.lang.startsWith('de'));if(v)u.voice=v;status.textContent=v&&!v.localService?'Playing using an online-capable voice. This may require internet.':'Playing browser-generated German practice audio.';u.onend=()=>status.textContent='Finished. Answer the statements, then review the transcript.';u.onerror=()=>status.textContent='Playback failed. Use the transcript or locally downloaded official audio.';speechSynthesis.speak(u)}
let examWritingIndex=0;
function renderExamWriting(){const e=examState(),t=EXAM.writing[examWritingIndex];main.innerHTML=examHeader('Schreiben · 30-minute practice','Answer all four guiding points.','Practise a complete email. Use a suitable greeting, connected sentences and an appropriate closing. This workshop saves drafts and supports self-review; it does not award examiner marks.')+`<div class="row">${EXAM.writing.map((p,i)=>`<button class="${i===examWritingIndex?'primary':''}" onclick="examWritingIndex=${i};renderExamWriting()">Task ${i+1}</button>`).join('')}</div>${clockBlock(30)}<div class="panel"><span class="pill">${esc(t.register)}</span><h2>${esc(t.title)}</h2><p lang="de">${esc(t.input)}</p><ol lang="de">${t.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol><label for="examDraft">Your email</label><textarea id="examDraft" lang="de" oninput="examState().drafts[examWritingIndex]=this.value;save();examWordCount()">${esc(e.drafts[examWritingIndex]||'')}</textarea><p id="examWordCount" class="small"></p><button onclick="downloadExamDraft()">Download this draft</button></div><div class="panel"><h2>Self-review before asking for feedback</h2>${['I answered guiding point 1 with useful detail.','I answered guiding point 2 with useful detail.','I answered guiding point 3 with useful detail.','I answered guiding point 4 with useful detail.','My greeting, tone and closing fit the reader.','My sentences connect clearly and my word order is understandable.','I checked verb forms, articles, cases and spelling.'].map(s=>`<label class="option"><input type="checkbox">${esc(s)}</label>`).join('')}<p class="small">These checks are not a language assessment. Ask a teacher or proficient speaker to assess task fulfilment, communication and language accuracy using the official criteria.</p><details><summary>Show an original model response for comparison</summary><p class="small">One possible response, written for this site. Compare how it covers the four points; do not memorise it as a universal exam answer.</p><div class="reading-text" lang="de">${esc(EXAM_MODELS[examWritingIndex])}</div></details><details><summary>Useful phrases, not a memorised answer</summary><p lang="de">Vielen Dank für deine Einladung. / Vielen Dank für Ihre Nachricht.<br>Leider kann ich nicht …, weil …<br>Ich würde gern wissen, ob …<br>Könnten Sie mir bitte mitteilen, …?<br>Wie wäre es, wenn wir …?<br>Ich freue mich auf deine / Ihre Antwort.</p></details></div>`;examWordCount()}
function examWordCount(){const t=document.getElementById('examDraft').value;document.getElementById('examWordCount').textContent=`${t.trim()?t.trim().split(/\s+/).length:0} words. Cover the four points clearly; a word count alone does not measure quality.`}
function downloadExamDraft(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([examState().drafts[examWritingIndex]||''],{type:'text/plain;charset=utf-8'}));a.download='mein-telc-entwurf-'+(examWritingIndex+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let speakingIndex=0;
function renderSpeaking(){const t=EXAM.speaking[speakingIndex];main.innerHTML=examHeader('Sprechen · interaction matters','Speak with someone, not just at a screen.','Practise all three parts: getting to know each other, discussing a topic and planning together. Use a partner when possible. Solo rehearsal cannot assess how well you interact.')+`<div class="row">${EXAM.speaking.map((p,i)=>`<button class="${i===speakingIndex?'primary':''}" onclick="speakingIndex=${i};renderSpeaking()">${esc(p.title)}</button>`).join('')}</div>${clockBlock(15)}<div class="panel"><h2>${esc(t.title)}</h2><p>${esc(t.brief)}</p><div class="grid"><div><h3>${speakingIndex===0?'Your starting topics':speakingIndex<3?'Partner A':'Planning points'}</h3><ul lang="de">${t.a.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div><h3>${speakingIndex===0?'Follow-up questions':speakingIndex<3?'Partner B':'Interaction support'}</h3><ul lang="de">${t.b.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div></div></div><div class="panel"><h2>Ask your partner for feedback</h2><p>Did I express my meaning with suitable words? Did I take part and respond? Did grammar errors make me hard to understand? Was my pronunciation understandable?</p><p lang="de"><b>Keep the conversation moving:</b><br>Wie siehst du das? · Kannst du das bitte wiederholen? · Ich habe eine andere Idee. · Das finde ich gut, weil … · Können wir uns darauf einigen?</p><p class="small">No microphone is activated and no speech is uploaded. You can use your device’s own recorder to listen back. For official performance feedback, use a qualified teacher or telc examiner.</p></div>`}
let localMedia=[];
function renderMockCompanion(){const e=examState();main.innerHTML=examHeader('Official mock companion','Use the real test as your benchmark.','Download the official telc mock and matching audio while online. Then select those files here to practise offline. They remain on your device and are not uploaded or added to this repository.')+`<div class="panel"><h2>1. Get the official files</h2><p><a href="https://www.telc.net/en/language-examinations/certificate-exams/german/certificate-german-telc-german-b1/" target="_blank" rel="noopener">Official exam page and free mock download</a><br><a href="https://www.telc.net/fileadmin/user_upload/mock_exams/Deutsch/telc_deutsch_b1.zip">Official mock download bundle (ZIP; internet required)</a></p><p>Extract the ZIP on your computer. Use the PDF and the corresponding recording from the same test version. Follow the instructions in those files.</p><label for="mockFiles">2. Select your local PDF and audio files</label><input id="mockFiles" type="file" multiple accept="application/pdf,audio/*,.mp3,.wav,.m4a,.ogg" onchange="chooseMockFiles(this)"><div id="mockMedia"></div><p class="small">Selected media stays only for this session; reselect after reloading. Browser playback controls are provided for learning. Follow the official recording without manual replay during a rehearsal.</p></div><div class="panel"><h2>3. Rehearse in the correct stages</h2><label for="mockStage">Stage timer</label> <select id="mockStage" onchange="document.getElementById('mockClock').innerHTML=clockBlock(Number(this.value))"><option value="90">Reading + language elements · 90 min</option><option value="30">Writing · 30 min</option><option value="20">Speaking preparation · 20 min</option><option value="15">Paired speaking · approx. 15 min</option></select><div id="mockClock">${clockBlock(90)}</div><p class="small">For listening, use the full official recording and its pauses rather than a separate guessed timer. For rehearsal, do not pause, consult the answer key or reveal transcripts.</p></div><div class="panel"><h2>4. Record assessed scores</h2><p>Mark objective answers with the matching answer key and its weighting. Enter writing and speaking points only after they have been assessed against the official criteria. Leaving a score blank keeps the result incomplete.</p><form id="mockScoreForm"><label>Test version / notes <input name="label" required maxlength="160" placeholder="Official mock 1 · first attempt"></label><div class="score-grid">${[['reading','Reading',75],['language','Language elements',30],['listening','Listening',75],['writing','Writing (assessed)',45],['speaking','Speaking (assessed)',75]].map(([key,label,max])=>`<label>${label} / ${max}<input type="number" name="${key}" min="0" max="${max}" step="0.5" placeholder="Not assessed"></label>`).join('')}</div><label class="option"><input name="familiar" type="checkbox">I had seen this test or its answers before.</label><button class="primary" type="submit">Save mock record</button></form><p id="mockScoreStatus" role="status"></p><p class="small">The published mock uses separate thresholds of 135/225 written and 45/75 oral. The comparison below uses those thresholds; it is not an official result or readiness prediction. Source: <a href="https://shop.telc.net/media/catalog/product/file/telc_deutsch_b1_zd_uebungstest_1.pdf" target="_blank" rel="noopener">telc mock booklet, scoring section</a>.</p></div><div class="panel"><h2>Saved records</h2>${e.mocks.length?e.mocks.map((m,i)=>mockRecordHTML(m,i)).join(''):'<p>No mock scores recorded yet.</p>'}</div>`;document.getElementById('mockScoreForm').onsubmit=saveMockScore;showMockMedia()}
function chooseMockFiles(input){for(const m of localMedia)URL.revokeObjectURL(m.url);localMedia=[];for(const f of input.files){const pdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),audio=f.type.startsWith('audio/')||/\.(mp3|wav|m4a|ogg)$/i.test(f.name);if(pdf||audio)localMedia.push({name:f.name,pdf,url:URL.createObjectURL(f)})}showMockMedia()}
function showMockMedia(){const el=document.getElementById('mockMedia');if(!el)return;el.innerHTML=localMedia.map(m=>`<div class="panel"><h3>${esc(m.name)}</h3>${m.pdf?`<p><a href="${m.url}" target="_blank" rel="noopener">Open selected PDF in a new tab</a></p><object data="${m.url}" type="application/pdf" style="width:100%;height:520px"><p>Use the link above or your local PDF reader.</p></object>`:`<audio controls preload="metadata" src="${m.url}" style="width:100%"></audio>`}</div>`).join('')}
function mockTotals(m){const keys=['reading','language','listening','writing'];const written=keys.every(k=>m[k]!==null)?keys.reduce((n,k)=>n+m[k],0):null;return {written,oral:m.speaking}}
function mockRecordHTML(m,i){const t=mockTotals(m),complete=t.written!==null&&t.oral!==null;return `<div class="callout"><b>${esc(m.label)}</b><p class="small">${esc(m.date.slice(0,10))} · ${m.familiar?'Familiar material: repetition result':'Marked as first encounter'}</p><p>Written: ${t.written===null?'incomplete':t.written+'/225'} · Oral: ${t.oral===null?'not assessed':t.oral+'/75'}</p><p>${!complete?'Incomplete: obtain the remaining assessed scores.':t.written>=135&&t.oral>=45?'This practice record meets both published thresholds. This is not a predicted exam pass.':'This practice record falls below at least one published threshold. Focus on the weaker areas and obtain feedback.'}</p><button onclick="deleteMock(${i})">Delete this record</button></div>`}
function saveMockScore(event){event.preventDefault();const f=event.target;const m={label:f.elements.label.value.trim(),date:new Date().toISOString(),familiar:f.elements.familiar.checked};if(!m.label)return;for(const [key,max] of [['reading',75],['language',30],['listening',75],['writing',45],['speaking',75]]){const v=f.elements[key].value;m[key]=v===''?null:Number(v);if(m[key]!==null&&(!Number.isFinite(m[key])||m[key]<0||m[key]>max||!Number.isInteger(m[key]*2))){document.getElementById('mockScoreStatus').textContent='Please enter valid scores in half-point steps within the displayed limits.';return}}const e=examState();e.mocks.unshift(m);e.mocks=e.mocks.slice(0,30);save();renderMockCompanion();document.getElementById('mockScoreStatus').textContent='Mock record saved.'}
function deleteMock(i){if(confirm('Delete this practice record?')){examState().mocks.splice(i,1);save();renderMockCompanion()}}
function renderMistakes(){const e=examState(),missed=EXAM.drills.flatMap(d=>(e.scores[d.id]?.missed||[]).map(j=>({d,q:d.questions[j]})));main.innerHTML=examHeader('Review from your latest complete attempts','Turn mistakes into your next lesson.','Review the reason for each missed item, then retry the whole drill. Correcting a drill updates this list; the list does not judge your overall exam level.')+(missed.length?missed.map(({d,q})=>`<div class="panel"><span class="eyebrow">${esc(d.title)}</span><h3>${esc(q.q)}</h3><p><b>Correct answer:</b> ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p><button onclick="openExamDrill('${d.id}')">Retry this drill</button></div>`).join(''):'<div class="panel"><p>No missed items in your latest complete exam-drill attempts. Start a drill to build your review list.</p><button onclick="go(\'Exam practice\')">Open exam practice</button></div>')+`<div class="panel"><label for="errorNotes"><b>My recurring errors and feedback</b></label><textarea id="errorNotes" oninput="examState().notes=this.value;save()" placeholder="Example: I miss negative words in listening. My teacher advised …">${esc(e.notes||'')}</textarea><p class="small">Keep personal notes local. Export progress to back them up.</p><button onclick="go('Grammar')">Open grammar library</button></div>`}
function renderResources(){main.innerHTML=examHeader('Sources & downloads','The right source for the right job.','Use telc for the exam format, authentic recordings, assessment criteria and official mock tests. Use Lingolia for additional grammar explanations. This site supplies original practice and organises your preparation.')+`<div class="panel"><h2>telc · official exam preparation</h2><ul><li><a target="_blank" rel="noopener" href="https://www.telc.net/en/language-examinations/certificate-exams/german/certificate-german-telc-german-b1/">Exam format, timings and free mock/audio download</a></li><li><a target="_blank" rel="noopener" href="https://shop.telc.net/media/catalog/product/file/telc_deutsch_b1_zd_uebungstest_1.pdf">Official mock booklet with answer key and assessment criteria</a></li><li><a target="_blank" rel="noopener" href="https://www.telc.net/lehrmaterialien/downloadbereich/">telc teaching-material downloads</a></li></ul><p class="small">Choose Zertifikat Deutsch / telc Deutsch B1. DTZ, DTB B1 and telc Deutsch A2·B1 have different formats. Check the name of every resource before using it.</p></div><div class="panel"><h2>Lingolia · language support</h2><ul><li><a target="_blank" rel="noopener" href="https://deutsch.lingolia.com/en/grammar">Grammar explanations and exercises</a></li><li><a target="_blank" rel="noopener" href="https://deutsch.lingolia.com/en/vocabulary">Vocabulary and expressions</a></li><li><a target="_blank" rel="noopener" href="https://deutsch.lingolia.com/en/reading">Reading practice</a></li><li><a target="_blank" rel="noopener" href="https://deutsch.lingolia.com/en/listening">Listening practice</a></li></ul><p>Use a grammar page to resolve a specific recurring mistake, then return to a connected text or exam task.</p></div><div class="panel"><h2>Offline and reuse</h2><p>All original lessons, drills, study plans and writing/speaking prompts are included in this application. External links need internet. Download official resources through their publishers for your own use, and select your local files in Mock companion.</p><p>Publisher materials are not copied into this repository. Free access does not make a complete course freely redistributable. We do not bypass access controls or subscriptions.</p><p class="small">Sources checked 6 November 2026. This independent tool is not affiliated with or endorsed by telc or Lingolia.</p></div>`}
function validatedExamProgress(p){
 if(!p||typeof p!=='object'||Array.isArray(p))throw Error('Invalid exam preparation data.');const c={days:[],scores:{},drafts:{},mocks:[],minutes:90};
 if(!Array.isArray(p.days)||!p.days.every(x=>Number.isInteger(x)&&x>=0&&x<28))throw Error('Invalid study days.');c.days=[...new Set(p.days)];
 if(![30,60,90,120].includes(p.minutes))throw Error('Invalid daily study time.');c.minutes=p.minutes;
 if(!p.scores||typeof p.scores!=='object'||Array.isArray(p.scores))throw Error('Invalid drill scores.');for(const [id,r] of Object.entries(p.scores)){const d=EXAM.drills.find(d=>d.id===id);if(!d||!r||!Number.isInteger(r.correct)||r.correct<0||r.correct>d.questions.length||!Array.isArray(r.missed)||!r.missed.every(j=>Number.isInteger(j)&&j>=0&&j<d.questions.length)||new Set(r.missed).size!==r.missed.length||r.correct+r.missed.length!==d.questions.length||typeof r.date!=='string'||!Number.isFinite(Date.parse(r.date)))throw Error('Invalid drill score.');c.scores[id]={correct:r.correct,missed:[...r.missed],date:r.date}}
 if(!p.drafts||typeof p.drafts!=='object'||Array.isArray(p.drafts))throw Error('Invalid exam drafts.');for(const [k,v] of Object.entries(p.drafts)){if(!/^[0-3]$/.test(k)||typeof v!=='string'||v.length>100000)throw Error('Invalid exam draft.');c.drafts[k]=v}
 if(p.notes!==undefined){if(typeof p.notes!=='string'||p.notes.length>100000)throw Error('Invalid error notes.');c.notes=p.notes}
 if(!Array.isArray(p.mocks)||p.mocks.length>30)throw Error('Invalid mock records.');for(const m of p.mocks){if(!m||typeof m.label!=='string'||m.label.length>160||typeof m.date!=='string'||!Number.isFinite(Date.parse(m.date))||typeof m.familiar!=='boolean')throw Error('Invalid mock record.');const n={label:m.label,date:m.date,familiar:m.familiar};for(const [k,max] of [['reading',75],['language',30],['listening',75],['writing',45],['speaking',75]]){const v=m[k];if(v!==null&&(typeof v!=='number'||!Number.isFinite(v)||v<0||v>max||!Number.isInteger(v*2)))throw Error('Invalid mock score.');n[k]=v}c.mocks.push(n)}return c;
}
