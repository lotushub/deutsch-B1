<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klar Deutsch · Offline German B1 Library</title><style>
:root{color-scheme:dark;--ink:#e6edf3;--green:#a78bfa;--lime:#d7c8ff;--paper:#0d1117;--line:#30363d;--muted:#9da7b3;--surface:#161b22;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button,input,textarea,select{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}button{padding:9px 16px}button:hover{background:#21262d;border-color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:3px}.primary{background:#7253c7;color:white;border-color:#9470ee}.primary:hover{background:#825fdf}a,.link{color:var(--blue)}header{max-width:1440px;margin:auto;height:78px;border-bottom:1px solid var(--line);padding:0 35px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--green);margin-right:8px}.badge,.pill{font-size:12px;display:inline-block;padding:4px 10px;background:#211b32;border:1px solid #493b66;border-radius:5px;color:#d7c8ff}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:calc(100vh - 78px)}aside{padding:30px 16px;border-right:1px solid var(--line)}nav{display:grid;gap:4px}nav button{border:0;background:transparent;text-align:left;font-size:14px;border-radius:5px;padding:10px 12px;color:#b7c1cd}nav button.active{color:#e5d9ff;background:#251e38;border-left:3px solid var(--green)}.aside-note{margin:32px 10px;color:var(--muted);font-size:12px}.aside-note b{color:var(--ink)}main{padding:38px 45px 55px;min-width:0}h1{font-size:clamp(32px,3.8vw,49px);letter-spacing:-1.5px;line-height:1.2;margin:15px 0 25px;font-weight:750}h2{font-size:25px;line-height:1.35;letter-spacing:-.5px}h3{font-size:19px;line-height:1.4}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;text-transform:uppercase;color:var(--green)}p{max-width:850px}.small{font-size:13px;color:var(--muted)}.hero{text-align:center;padding:20px 0 35px;border-bottom:1px solid var(--line)}.hero h1{font-size:clamp(35px,4vw,55px);border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:27px}.hero h2{font-size:23px}.hero p{margin:18px auto;color:#bdc6d2}.hero-nav{display:flex;justify-content:center;gap:7px 18px;flex-wrap:wrap;margin-top:26px}.hero-nav button{border:0;background:transparent;color:var(--blue);padding:0;text-decoration:underline;text-underline-offset:4px}.hero .row{justify-content:center}.row{display:flex;flex-wrap:wrap;gap:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 30px}.stat{background:var(--surface);border:1px solid var(--line);padding:16px 20px;border-radius:8px;color:var(--muted);font-size:13px}.stat strong{display:block;color:var(--ink);font-size:28px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);padding:23px;border-radius:9px;width:100%;text-align:left;display:block;transition:border-color .15s}.card:hover{background:#1b212b;border-color:#8263c2}.card h3{color:var(--blue);margin:12px 0}.card p{font-size:14px;color:var(--muted);line-height:1.6}.card-foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#bc9cff;margin-top:22px}.num{font-size:12px;color:var(--muted);margin-right:9px}.panel{background:var(--surface);border:1px solid var(--line);padding:27px;border-radius:9px;margin:22px 0}.callout{border-left:4px solid #9b6aff;padding:15px 22px;background:#171321;margin:30px 0}.callout h3{color:#c4a4ff;margin:0}.callout p{margin-bottom:0;color:#c6c2d1}.search{width:100%;padding:12px 16px;margin:12px 0 23px}.catalog-group{margin:28px 0}.catalog-group h2{border-bottom:1px solid var(--line);padding-bottom:12px}.toc-link{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #252b35;border-radius:0;padding:13px 3px;color:var(--blue);gap:14px}.toc-link small{color:var(--muted);white-space:nowrap}.toc-link:hover{background:var(--surface)}.example{border-left:3px solid #a78bfa;padding:18px 22px;background:#1d192b;margin-top:22px;white-space:pre-line}.example p{margin:5px 0}.question{padding:23px 0;border-bottom:1px solid var(--line)}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:12px}label.option{display:block;margin:8px 0;padding:10px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer}label.option:has(input:checked){background:#28203e;border-color:#a78bfa}input[type=radio],input[type=checkbox]{accent-color:#a78bfa;margin-right:10px}.feedback{margin-top:12px;background:#30251b;border-left:3px solid #e9b26a;padding:13px 17px;font-size:14px}.feedback.good{background:#172b26;border-left-color:#6fd3a6}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0}.flash{text-align:center;padding:45px 22px;min-height:270px}.flash h2{font-size:31px}.progress{height:6px;background:#30363d;overflow:hidden;border-radius:8px}.progress div{height:100%;background:#a78bfa}textarea{width:100%;min-height:225px;padding:17px}select{padding:8px 12px}details{margin-top:20px}summary{cursor:pointer;color:var(--blue)}footer{border-top:1px solid var(--line);padding-top:20px;margin-top:45px;font-size:12px;color:var(--muted)}.hidden,[hidden]{display:none!important}.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.filter-row button{font-size:12px}.empty{color:var(--muted);padding:20px}.writing-note{font-size:13px;color:var(--muted)}@media(min-width:1000px){aside>nav{position:sticky;top:22px}}@media(max-width:950px){main{padding:28px}.grid{grid-template-columns:1fr}.layout{grid-template-columns:190px minmax(0,1fr)}header{padding:0 25px}}@media(max-width:640px){header{height:68px;padding:0 18px}header .small{display:none}.layout{display:block;border:0}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow-x:auto;gap:3px}nav button{white-space:nowrap;padding:8px 10px}.aside-note{display:none}main{padding:24px 18px}.hero{padding-top:10px}.hero h1{letter-spacing:-1px}.hero h2{font-size:19px}.stats{gap:8px}.stat{padding:13px 11px;font-size:11px}.stat strong{font-size:24px}.section-head{align-items:flex-start}.panel{padding:20px}.toc-link small{white-space:normal;text-align:right}h2{font-size:22px}.hero-nav{gap:10px 16px}}
</style></head><body><header><div class="brand"><span>K.</span>Klar Deutsch</div><div class="row"><span class="small">Learn · practise · understand</span><span class="badge">Level B1</span></div></header><div class="layout"><aside><nav aria-label="Learning sections" id="nav"></nav><div class="aside-note"><b>Your offline German library.</b><p>English explanations.<br>Real-life German.<br>One step at a time.</p><div class="progress"><div id="sideprogress"></div></div><p id="sidecount"></p><p id="storageNote">Progress stays in this browser.</p></div></aside><main id="main"></main></div><script>
const DATA={"lessons": [{"title": "weil, dass & obwohl", "cat": "Grammar", "rule": "Subordinate clauses send the conjugated verb to the end. Use weil for a reason, dass for reported content, and obwohl for a contrast. Separate the clauses with a comma.", "example": "Ich lerne Deutsch, weil ich in Zürich arbeite.", "translation": "I am learning German because I work in Zurich.", "questions": [{"q": "Ich bleibe zu Hause, weil ich krank ___.", "options": ["bin", "ist", "sein"], "answer": 0, "why": "The subject ich takes bin. The verb goes at the end of the weil clause."}, {"q": "___ es regnet, gehen wir spazieren.", "options": ["Weil", "Obwohl", "Dass"], "answer": 1, "why": "Obwohl expresses contrast: we go for a walk although it is raining."}, {"q": "Ich glaube, dass er morgen ___.", "options": ["kommt", "kommen", "kommst"], "answer": 0, "why": "Er takes kommt, placed at the end of the dass clause."}], "group": "Sentence structure"}, {"title": "Relative clauses", "cat": "Grammar", "rule": "A relative clause describes a noun. Its verb goes last. Gender and number come from the noun; the case comes from the pronoun’s role inside the relative clause. Dative plural uses denen.", "example": "Das ist der Mann, dem ich geholfen habe.", "translation": "That is the man whom I helped.", "questions": [{"q": "Die Frau, ___ hier wohnt, ist Ärztin.", "options": ["der", "die", "den"], "answer": 1, "why": "Frau is feminine and the relative pronoun is the subject: die."}, {"q": "Das ist der Film, ___ ich gesehen habe.", "options": ["der", "dem", "den"], "answer": 2, "why": "Film is masculine and is the object of gesehen: accusative den."}, {"q": "Die Leute, mit ___ ich arbeite, sind nett.", "options": ["denen", "die", "deren"], "answer": 0, "why": "Mit requires dative. The dative plural relative pronoun is denen."}], "group": "Pronouns"}, {"title": "Konjunktiv II: wishes & politeness", "cat": "Grammar", "rule": "Use würde + infinitive for many hypothetical actions. Common forms include hätte (haben), wäre (sein), and könnte (können). These forms also make requests more polite.", "example": "Wenn ich mehr Zeit hätte, würde ich öfter lesen.", "translation": "If I had more time, I would read more often.", "questions": [{"q": "___ Sie mir bitte helfen?", "options": ["Könnten", "Können würde", "Könntest"], "answer": 0, "why": "Könnten Sie is a polite request with formal Sie."}, {"q": "Wenn ich reich ___, würde ich reisen.", "options": ["bin", "wäre", "war"], "answer": 1, "why": "An unreal condition uses wäre."}, {"q": "Ich würde gern in Berlin ___.", "options": ["wohne", "wohnen", "gewohnt"], "answer": 1, "why": "Würde combines with an infinitive at the end."}], "group": "Verbs"}, {"title": "Passive voice", "cat": "Grammar", "rule": "The process passive focuses on an action: werden + past participle. The form of werden changes with the subject and tense. The agent can be introduced with von + dative.", "example": "Die Fahrräder werden in der Werkstatt repariert.", "translation": "The bicycles are being repaired in the workshop.", "questions": [{"q": "Das Paket ___ morgen geliefert.", "options": ["wird", "werden", "hat"], "answer": 0, "why": "Das Paket is singular, so use wird + geliefert."}, {"q": "Die Fenster werden ___.", "options": ["putzen", "geputzt", "geputzen"], "answer": 1, "why": "The passive needs the past participle geputzt."}, {"q": "Der Brief ___ gestern geschrieben.", "options": ["wird", "wurde", "werden"], "answer": 1, "why": "Gestern calls for a past form here: wurde geschrieben."}], "group": "Verbs"}, {"title": "Past tenses in everyday stories", "cat": "Grammar", "rule": "In conversation, use Perfekt for many completed events. Movement to a destination often takes sein; most other verbs take haben. Sein, haben and modal verbs commonly use Präteritum. Plusquamperfekt describes an earlier past event.", "example": "Nachdem ich gegessen hatte, bin ich zum Kurs gefahren.", "translation": "After I had eaten, I went to the course.", "questions": [{"q": "Gestern ___ wir nach Bern gefahren.", "options": ["haben", "sind", "werden"], "answer": 1, "why": "Fahren with a destination uses sein in the Perfekt."}, {"q": "Ich ___ gestern keine Zeit.", "options": ["hatte", "hätte", "haben"], "answer": 0, "why": "Hatte is the Präteritum of haben."}, {"q": "Als er ankam, ___ ich schon gekocht.", "options": ["habe", "hatte", "bin"], "answer": 1, "why": "Cooking happened before his arrival: hatte gekocht."}], "group": "Tenses"}, {"title": "Adjective endings", "cat": "Grammar", "rule": "Adjectives before nouns take endings. After a definite article, use -e in nominative singular and accusative feminine/neuter; most other forms take -en. After ein, the adjective may need to show gender itself.", "example": "Ich suche eine ruhige Wohnung mit einem kleinen Balkon.", "translation": "I am looking for a quiet flat with a small balcony.", "questions": [{"q": "Ich kaufe den rot___ Mantel.", "options": ["e", "en", "er"], "answer": 1, "why": "After den in masculine accusative, the adjective takes -en."}, {"q": "Das ist ein schön___ Haus.", "options": ["es", "e", "en"], "answer": 0, "why": "Ein does not show neuter gender here; schönes supplies the ending."}, {"q": "Mit einer nett___ Kollegin lerne ich Deutsch.", "options": ["e", "er", "en"], "answer": 2, "why": "After einer in dative feminine, use netten."}], "group": "Adjectives"}, {"title": "Two-way prepositions", "cat": "Grammar", "rule": "An, auf, hinter, in, neben, über, unter, vor and zwischen use accusative for a destination and dative for a location. Ask wohin? for a destination and wo? for a location.", "example": "Ich stelle die Tasche auf den Tisch. Sie steht jetzt auf dem Tisch.", "translation": "I put the bag onto the table. It is now on the table.", "questions": [{"q": "Das Bild hängt an ___ Wand.", "options": ["die", "der", "den"], "answer": 1, "why": "A fixed location uses dative: an der Wand."}, {"q": "Ich gehe in ___ Küche.", "options": ["der", "die", "den"], "answer": 1, "why": "The kitchen is the destination: in die Küche."}, {"q": "Wir sitzen auf ___ Balkon.", "options": ["dem", "den", "der"], "answer": 0, "why": "Sitzen describes a location: auf dem Balkon."}], "group": "Prepositions"}, {"title": "Infinitives with zu", "cat": "Grammar", "rule": "Use zu + infinitive after expressions such as versuchen and es ist wichtig. With separable verbs, place zu between prefix and stem. Um ... zu expresses a purpose when both clauses have the same subject; damit can introduce a different subject.", "example": "Ich lerne jeden Tag, um die Prüfung zu bestehen.", "translation": "I study every day in order to pass the exam.", "questions": [{"q": "Ich versuche, früh ___.", "options": ["aufzustehen", "zu aufstehen", "aufstehen zu"], "answer": 0, "why": "The separable verb aufstehen becomes aufzustehen."}, {"q": "Sie spart Geld, ___ ein Fahrrad zu kaufen.", "options": ["damit", "um", "weil"], "answer": 1, "why": "A shared subject and purpose use um ... zu."}, {"q": "Ich spreche langsam, damit du mich besser ___.", "options": ["verstehen", "zu verstehen", "verstehst"], "answer": 2, "why": "Damit introduces a finite subordinate clause: du verstehst."}], "group": "Sentence structure"}, {"title": "Connectors & word order", "cat": "Grammar", "rule": "Deshalb and trotzdem occupy a position in the main clause; when they come first, the conjugated verb comes second and the subject follows. Weil and obwohl introduce subordinate clauses with the verb at the end.", "example": "Ich bin müde. Trotzdem mache ich meine Hausaufgaben.", "translation": "I am tired. Nevertheless, I am doing my homework.", "questions": [{"q": "Es regnet. Deshalb ___ ich zu Hause.", "options": ["bleibe", "ich bleibe", "bleiben"], "answer": 0, "why": "Deshalb occupies position one; bleibe is position two."}, {"q": "Er ist krank. ___ geht er zur Arbeit.", "options": ["Deshalb", "Trotzdem", "Weil"], "answer": 1, "why": "Going to work despite illness is a contrast: trotzdem."}, {"q": "Ich lerne, ___ ich die Prüfung bestehen möchte.", "options": ["deshalb", "weil", "trotzdem"], "answer": 1, "why": "The verb-final clause is introduced by weil."}], "group": "Sentence structure"}, {"title": "Verbs with prepositions", "cat": "Grammar", "rule": "Learn fixed combinations together with the required case: warten auf + accusative, teilnehmen an + dative, sich interessieren für + accusative. For things, use worauf/darauf; for people, use auf wen/auf ihn.", "example": "Ich freue mich auf den Urlaub.", "translation": "I am looking forward to the holiday.", "questions": [{"q": "Ich warte ___ den Bus.", "options": ["auf", "für", "an"], "answer": 0, "why": "The fixed combination is warten auf + accusative."}, {"q": "Sie nimmt an ___ Kurs teil.", "options": ["den", "dem", "der"], "answer": 1, "why": "Teilnehmen an requires dative: an dem Kurs."}, {"q": "___ interessierst du dich? – Für Musik.", "options": ["Wofür", "Womit", "Woran"], "answer": 0, "why": "Sich interessieren für becomes wofür when asking about a thing."}], "group": "Prepositions"}, {"title": "A new start in Leipzig", "cat": "Reading", "rule": "Read for the main idea first, then find evidence for each answer. You do not need to translate every word.", "example": "Seit drei Monaten wohnt Sara in Leipzig. Früher fuhr sie mit dem Auto zur Arbeit. Jetzt nimmt sie die Straßenbahn, weil sie Geld sparen möchte. Ihre neue Wohnung ist kleiner als die alte, aber sie liegt näher am Büro. Am Samstag trifft Sara ihre Nachbarin im Park. Zusammen wollen sie einen Sprachkurs suchen. Sara spricht schon gut Deutsch, möchte aber beim Telefonieren sicherer werden.", "translation": "Sara moved to Leipzig three months ago. She now travels by tram to save money. Her smaller flat is closer to work. She and her neighbour plan to find a language course so Sara can feel more confident on the phone.", "questions": [{"q": "Warum fährt Sara mit der Straßenbahn?", "options": ["Sie möchte Geld sparen.", "Ihr Auto ist kaputt.", "Sie arbeitet im Park."], "answer": 0, "why": "The text states: weil sie Geld sparen möchte."}, {"q": "Was ist ein Vorteil der neuen Wohnung?", "options": ["Sie ist größer.", "Sie liegt näher am Büro.", "Sie kostet nichts."], "answer": 1, "why": "The flat is smaller, but closer to the office."}, {"q": "Was möchte Sara verbessern?", "options": ["Kochen", "Autofahren", "Telefonieren auf Deutsch"], "answer": 2, "why": "She wants to feel more confident when making phone calls."}], "group": "Everyday life"}, {"title": "An appointment change", "cat": "Listening", "rule": "Listen before revealing the transcript. The audio uses your browser’s German text-to-speech voice, when available. Listen for the date, time and action you need to take.", "example": "Guten Tag, Frau Keller. Hier ist die Praxis von Dr. Braun. Leider müssen wir Ihren Termin am Dienstag verschieben, weil die Ärztin krank ist. Wir können Ihnen stattdessen einen Termin am Donnerstag um vierzehn Uhr dreißig anbieten. Bitte rufen Sie uns bis morgen Mittag zurück. Bringen Sie zum Termin Ihre Versicherungskarte und die Liste Ihrer Medikamente mit. Vielen Dank.", "translation": "The practice needs to move Tuesday’s appointment because the doctor is ill. They offer Thursday at 2:30 pm. Mrs Keller should call back by tomorrow noon and bring her insurance card and medication list.", "questions": [{"q": "Wann ist der neue Termin?", "options": ["Dienstag um 14:30", "Donnerstag um 14:30", "Donnerstag um 16:30"], "answer": 1, "why": "The message offers Donnerstag um vierzehn Uhr dreißig."}, {"q": "Bis wann soll Frau Keller zurückrufen?", "options": ["Bis heute Abend", "Bis nächste Woche", "Bis morgen Mittag"], "answer": 2, "why": "The deadline is tomorrow at noon."}, {"q": "Was soll sie mitbringen?", "options": ["Versicherungskarte und Medikamentenliste", "Reisepass und Foto", "Nur Bargeld"], "answer": 0, "why": "The message asks for the insurance card and a list of medications."}], "group": "Appointments"}, {"title": "Present tense & separable verbs", "cat": "Grammar", "group": "Tenses", "rule": "In a main clause, the conjugated verb is in second position. Separable prefixes move to the end. In a subordinate clause, the prefix stays attached. Watch stem changes such as fahren → du fährst and lesen → er liest.", "example": "Der Kurs fängt um neun an. Ich weiß, dass er um neun anfängt.", "translation": "The course starts at nine. I know that it starts at nine.", "questions": [{"q": "Wann ___ der Unterricht an?", "options": ["fangen", "fängt", "fängst"], "answer": 1, "why": "Unterricht is singular: er fängt an."}, {"q": "Ich weiß, dass sie früh ___.", "options": ["aufsteht", "steht auf", "aufstehen"], "answer": 0, "why": "A separable verb stays together at the end of a subordinate clause."}, {"q": "Er ___ jeden Abend die Zeitung.", "options": ["lese", "lesen", "liest"], "answer": 2, "why": "Lesen changes its stem in the third-person singular: er liest."}]}, {"title": "Perfekt: haben or sein?", "cat": "Grammar", "group": "Tenses", "rule": "Build the Perfekt with haben or sein in the present tense and a past participle. Most verbs use haben. Many intransitive verbs describing a change of location or state use sein, as do bleiben and sein. Learn irregular participles with their verbs.", "example": "Wir sind angekommen und haben unsere Freunde besucht.", "translation": "We arrived and visited our friends.", "questions": [{"q": "Sie ___ gestern eingeschlafen.", "options": ["hat", "ist", "wird"], "answer": 1, "why": "Einschlafen describes a change of state and uses sein."}, {"q": "Ich habe meine Freundin ___.", "options": ["besuchen", "gebesucht", "besucht"], "answer": 2, "why": "The inseparable prefix be- prevents an extra ge-."}, {"q": "Wir ___ den Film gesehen.", "options": ["haben", "sind", "werden"], "answer": 0, "why": "Sehen takes haben: wir haben gesehen."}]}, {"title": "Präteritum: common irregular verbs", "cat": "Grammar", "group": "Tenses", "rule": "Präteritum is common in written stories. It is also common in conversation for sein, haben and modal verbs. Strong verbs change their stem. Ich and er/sie/es usually have no added ending in strong-verb Präteritum.", "example": "Als Kind war ich oft bei meiner Oma. Sie las mir Geschichten vor.", "translation": "As a child I often stayed with my grandma. She read stories to me.", "questions": [{"q": "Früher ___ wir auf dem Land.", "options": ["waren", "war", "wären"], "answer": 0, "why": "Wir takes waren in the Präteritum of sein."}, {"q": "Er ___ gestern nicht kommen.", "options": ["können", "konnte", "könnte"], "answer": 1, "why": "The past form is konnte; könnte expresses a possibility or hypothetical situation."}, {"q": "Sie ___ den ganzen Brief.", "options": ["leste", "lesen", "las"], "answer": 2, "why": "Lesen is strong: lesen – las – gelesen."}]}, {"title": "Plusquamperfekt & event order", "cat": "Grammar", "group": "Tenses", "rule": "Use hatte or war + past participle for an event completed before another past event. Nachdem often introduces the earlier event. The later event can be expressed in Präteritum or Perfekt.", "example": "Nachdem der Zug abgefahren war, kamen wir am Bahnhof an.", "translation": "After the train had departed, we arrived at the station.", "questions": [{"q": "Nachdem ich gegessen ___, ging ich los.", "options": ["hatte", "habe", "bin"], "answer": 0, "why": "Essen uses haben; the earlier past event takes hatte gegessen."}, {"q": "Sie war schon ___, als ich anrief.", "options": ["gehen", "gegangen", "ging"], "answer": 1, "why": "Plusquamperfekt uses war + the participle gegangen."}, {"q": "Welche Handlung war zuerst? „Er hatte bezahlt, bevor er ging.“", "options": ["Er ging.", "Beide gleichzeitig.", "Er bezahlte."], "answer": 2, "why": "Hatte bezahlt marks the earlier action."}]}, {"title": "Futur I & future arrangements", "cat": "Grammar", "group": "Tenses", "rule": "Futur I uses werden + infinitive. It can express a prediction, intention or assumption. German also often uses the present tense with a future time expression for a fixed arrangement.", "example": "Morgen treffen wir uns um zehn. Es wird bestimmt interessant werden.", "translation": "Tomorrow we are meeting at ten. It will surely be interesting.", "questions": [{"q": "Ich ___ dich morgen anrufen.", "options": ["wirst", "werde", "werden"], "answer": 1, "why": "Ich takes werde; anrufen stays an infinitive."}, {"q": "Wir werden nächstes Jahr nach Wien ___.", "options": ["reisen", "gereist", "reist"], "answer": 0, "why": "Futur I uses the infinitive reisen."}, {"q": "„Morgen beginnt der Kurs.“ bezieht sich auf …", "options": ["die Vergangenheit", "eine Gewohnheit", "die Zukunft"], "answer": 2, "why": "Morgen gives a future time even though beginnt is present tense."}]}, {"title": "Modal verbs & necessity", "cat": "Grammar", "group": "Verbs", "rule": "Modal verbs combine with an infinitive at the end: müssen, können, dürfen, sollen, wollen and mögen. Nicht müssen means that something is not necessary; nicht dürfen means that it is forbidden. Möchten is a polite way to express a wish.", "example": "Du musst nicht kommen, aber du darfst gern mitmachen.", "translation": "You do not have to come, but you are welcome to join in.", "questions": [{"q": "Hier darf man nicht rauchen. Das bedeutet …", "options": ["Rauchen ist verboten.", "Rauchen ist nicht nötig.", "Rauchen ist erwünscht."], "answer": 0, "why": "Nicht dürfen expresses a prohibition."}, {"q": "Ich ___ heute länger arbeiten, weil viel zu tun ist.", "options": ["darf nicht", "muss", "möchte nicht"], "answer": 1, "why": "Müssen expresses necessity here."}, {"q": "Du musst nicht bezahlen. Du ___ kostenlos teilnehmen.", "options": ["musst", "sollst nicht", "kannst"], "answer": 2, "why": "Kannst expresses that participation is possible without payment."}]}, {"title": "Reflexive verbs", "cat": "Grammar", "group": "Verbs", "rule": "Reflexive pronouns refer back to the subject. Accusative: mich, dich, sich, uns, euch, sich. Use dative mir or dir when another accusative object is present, for example ich wasche mir die Hände. Some verbs are learned with sich and a fixed preposition.", "example": "Ich erinnere mich an den Termin und ziehe mir eine Jacke an.", "translation": "I remember the appointment and put on a jacket.", "questions": [{"q": "Wir freuen ___ auf den Urlaub.", "options": ["sich", "euch", "uns"], "answer": 2, "why": "Wir takes the reflexive pronoun uns."}, {"q": "Ich wasche ___ die Hände.", "options": ["mich", "mir", "sich"], "answer": 1, "why": "Die Hände is the accusative object, so the reflexive pronoun is dative mir."}, {"q": "Er interessiert ___ für Politik.", "options": ["sich", "ihm", "mich"], "answer": 0, "why": "The combination is sich interessieren für; er takes sich."}]}, {"title": "The imperative", "cat": "Grammar", "group": "Verbs", "rule": "The imperative gives instructions or requests. For du, use the imperative stem; for ihr, use the present-tense ihr form without ihr. The formal form places Sie after the verb. Bitte makes a request friendlier. Sein has the special forms sei, seid and seien Sie.", "example": "Bitte ruf mich morgen an! Seien Sie bitte pünktlich.", "translation": "Please call me tomorrow! Please be on time.", "questions": [{"q": "Formal: ___ Sie bitte Platz!", "options": ["Nimm", "Nehmt", "Nehmen"], "answer": 2, "why": "The formal imperative is Nehmen Sie."}, {"q": "To several friends: ___ bitte leise!", "options": ["Sei", "Seid", "Seien Sie"], "answer": 1, "why": "The ihr imperative of sein is seid."}, {"q": "To one friend: ___ mir bitte!", "options": ["Hilf", "Helft", "Helfen"], "answer": 0, "why": "Helfen has the singular imperative hilf."}]}, {"title": "Nouns, gender & plural", "cat": "Grammar", "group": "Nouns and articles", "rule": "Learn nouns together with their article and plural. Nouns ending in -ung, -heit and -keit are generally feminine; diminutives ending in -chen are neuter. Plurals vary: do not assume that every noun simply adds -s. All nouns begin with a capital letter.", "example": "Die Entscheidung ist wichtig. Die Entscheidungen sind schwierig.", "translation": "The decision is important. The decisions are difficult.", "questions": [{"q": "___ Möglichkeit ist interessant.", "options": ["Der", "Die", "Das"], "answer": 1, "why": "Nouns ending in -keit are feminine."}, {"q": "Das Mädchen ist klein. „Mädchen“ ist grammatisch …", "options": ["maskulin", "feminin", "neutral"], "answer": 2, "why": "The diminutive ending -chen makes the noun neuter."}, {"q": "Plural: das Buch → die ___.", "options": ["Bücher", "Buchen", "Buchs"], "answer": 0, "why": "The plural is Bücher, with an umlaut and -er."}]}, {"title": "Articles & the four cases", "cat": "Grammar", "group": "Nouns and articles", "rule": "The subject is nominative. A direct object is often accusative; an indirect recipient is often dative. Verbs and prepositions can also require specific cases. Definite articles: der/den/dem/des for masculine; die/die/der/der for feminine; das/das/dem/des for neuter; die/die/den/der for plural.", "example": "Die Frau gibt dem Kind einen Apfel.", "translation": "The woman gives the child an apple.", "questions": [{"q": "Ich sehe ___ Mann.", "options": ["der", "dem", "den"], "answer": 2, "why": "The direct object is masculine accusative: den Mann."}, {"q": "Sie hilft ___ Nachbarin.", "options": ["die", "der", "das"], "answer": 1, "why": "Helfen requires dative: der Nachbarin."}, {"q": "___ Kind spielt im Garten.", "options": ["Das", "Dem", "Den"], "answer": 0, "why": "The subject is nominative: das Kind."}]}, {"title": "Genitive & n-declension", "cat": "Grammar", "group": "Nouns and articles", "rule": "The genitive expresses possession. Masculine and neuter nouns often add -(e)s: des Mannes, des Kindes. A group of masculine nouns, such as der Student and der Kollege, take -(e)n in every singular case except nominative. Learn these as n-declension nouns.", "example": "Das Fahrrad des Studenten steht vor der Tür.", "translation": "The student’s bicycle is by the door.", "questions": [{"q": "Ich spreche mit dem ___.", "options": ["Student", "Studenten", "Students"], "answer": 1, "why": "Student is an n-declension noun: dem Studenten."}, {"q": "Das ist das Auto meines ___.", "options": ["Vaters", "Vater", "Vätern"], "answer": 0, "why": "Masculine genitive singular: meines Vaters."}, {"q": "Ich kenne den ___ gut.", "options": ["Kollege", "Kolleges", "Kollegen"], "answer": 2, "why": "Kollege takes -n in accusative singular: den Kollegen."}]}, {"title": "Personal & possessive pronouns", "cat": "Grammar", "group": "Pronouns", "rule": "Personal pronouns change with case: ich/mich/mir, du/dich/dir, er/ihn/ihm. Possessives such as mein and dein take endings based on the possessed noun, not the owner. Learn pronouns in short sentences to connect the form with its role.", "example": "Ich gebe ihr mein Buch. Sie gibt mir ihren Stift.", "translation": "I give her my book. She gives me her pen.", "questions": [{"q": "Der Mann ist nett. Ich helfe ___.", "options": ["ihn", "ihm", "er"], "answer": 1, "why": "Helfen requires dative: ihm."}, {"q": "Das ist Anna. Kennst du ___?", "options": ["ihr", "sie", "ihnen"], "answer": 1, "why": "Kennen takes accusative: sie."}, {"q": "Ich besuche ___ Schwester.", "options": ["meinen", "meinem", "meine"], "answer": 2, "why": "Schwester is feminine accusative: meine Schwester."}]}, {"title": "Comparatives & superlatives", "cat": "Grammar", "group": "Adjectives", "rule": "Use -er for a comparison and als for two unequal things. Equal things use so ... wie. Many adjectives form a superlative with am ... -sten. Irregular forms include gut – besser – am besten and viel – mehr – am meisten.", "example": "Der Zug ist schneller als der Bus, aber das Fahrrad ist am billigsten.", "translation": "The train is faster than the bus, but the bicycle is the cheapest.", "questions": [{"q": "Heute geht es mir ___ als gestern.", "options": ["gut", "besser", "am besten"], "answer": 1, "why": "The comparative of gut is besser."}, {"q": "Mein Zimmer ist so groß ___ deins.", "options": ["als", "wie", "denn"], "answer": 1, "why": "Equal comparisons use so ... wie."}, {"q": "Von allen läuft Lea am ___.", "options": ["schneller", "schnell", "schnellsten"], "answer": 2, "why": "The superlative is am schnellsten."}]}, {"title": "Adverbs: time, place & manner", "cat": "Grammar", "group": "Adverbs", "rule": "Adverbs describe circumstances and generally do not take adjective endings. Time information often comes before manner and place when all are neutral new information, but emphasis can change the order. Erst means not before a point in time or only so far; schon suggests earlier than expected or already.", "example": "Wir fahren morgen mit dem Zug nach Hamburg.", "translation": "We are travelling to Hamburg by train tomorrow.", "questions": [{"q": "Sie kommt nicht heute, sondern ___ morgen.", "options": ["erst", "schon", "immer"], "answer": 0, "why": "Erst morgen means not until tomorrow."}, {"q": "„Dort“ beantwortet welche Frage?", "options": ["Wann?", "Wo?", "Warum?"], "answer": 1, "why": "Dort is a place adverb: where?"}, {"q": "Er spricht ___.", "options": ["langsamen", "langsamerem", "langsam"], "answer": 2, "why": "An adverb modifying spricht does not take an adjective ending."}]}, {"title": "Dative & accusative prepositions", "cat": "Grammar", "group": "Prepositions", "rule": "Always-dative prepositions include aus, bei, mit, nach, seit, von and zu. Always-accusative prepositions include durch, für, gegen, ohne and um. Contract common pairs: zu dem → zum, zu der → zur, bei dem → beim. Seit usually describes a situation continuing into the present.", "example": "Seit einem Jahr fahre ich mit dem Bus zur Arbeit.", "translation": "For a year now, I have been taking the bus to work.", "questions": [{"q": "Das Geschenk ist für ___ Bruder.", "options": ["meinem", "meinen", "meiner"], "answer": 1, "why": "Für requires accusative: meinen Bruder."}, {"q": "Ich wohne seit ___ Monat hier.", "options": ["einem", "einen", "einer"], "answer": 0, "why": "Seit requires dative: einem Monat."}, {"q": "Ohne ___ geht es nicht.", "options": ["dir", "du", "dich"], "answer": 2, "why": "Ohne requires accusative: dich."}]}, {"title": "Questions & indirect questions", "cat": "Grammar", "group": "Sentence structure", "rule": "Yes/no questions start with the finite verb. W-questions start with the question word, followed by the finite verb. Indirect questions have verb-final order; use ob for an indirect yes/no question. Do not use wenn to mean whether.", "example": "Können Sie mir sagen, wann der Zug abfährt?", "translation": "Can you tell me when the train departs?", "questions": [{"q": "Weißt du, ___ er heute kommt?", "options": ["wenn", "ob", "als"], "answer": 1, "why": "Ob introduces an indirect yes/no question."}, {"q": "Wo ___ du?", "options": ["wohnst", "du wohnst", "wohnen"], "answer": 0, "why": "The question word is followed by the finite verb: Wo wohnst du?"}, {"q": "Können Sie sagen, wo der Bahnhof ___?", "options": ["sein", "sind", "ist"], "answer": 2, "why": "The finite verb comes at the end of the indirect question."}]}, {"title": "Negation: nicht & kein", "cat": "Grammar", "group": "Sentence structure", "rule": "Kein negates a noun with an indefinite article or no article: ein Auto → kein Auto. Nicht negates verbs, adjectives, definite noun phrases or particular sentence parts. Its position depends on what is negated. Learn examples rather than treating nicht as always the last word.", "example": "Ich habe kein Auto. Heute fahre ich nicht mit dem Bus.", "translation": "I do not have a car. Today I am not taking the bus.", "questions": [{"q": "Ich habe ___ Zeit.", "options": ["nicht", "keine", "keinen"], "answer": 1, "why": "Zeit is a feminine noun without an article: keine Zeit."}, {"q": "Das ist ___ mein Schlüssel.", "options": ["kein", "keine", "nicht"], "answer": 2, "why": "A possessive phrase is negated with nicht."}, {"q": "Der Film ist ___ interessant.", "options": ["nicht", "kein", "keine"], "answer": 0, "why": "Use nicht to negate the adjective interessant."}]}, {"title": "Time clauses: als, wenn & bevor", "cat": "Grammar", "group": "Sentence structure", "rule": "Use als for a single event or period in the past. Use wenn for repeated events or conditions, and for future when. Bevor means before and nachdem means after. These conjunctions introduce subordinate clauses with the finite verb at the end.", "example": "Als ich klein war, besuchte ich oft meine Großeltern.", "translation": "When I was little, I often visited my grandparents.", "questions": [{"q": "___ ich gestern ankam, war niemand da.", "options": ["Wenn", "Als", "Ob"], "answer": 1, "why": "A single arrival in the past uses als."}, {"q": "Immer ___ es regnet, nehme ich den Bus.", "options": ["als", "ob", "wenn"], "answer": 2, "why": "A repeated situation uses wenn."}, {"q": "Ich putze die Zähne, ___ ich ins Bett gehe.", "options": ["bevor", "nachdem", "obwohl"], "answer": 0, "why": "The toothbrushing happens before going to bed: bevor."}]}, {"title": "Dates, times & appointments", "cat": "Vocabulary practice", "group": "Everyday language", "rule": "Use am with dates and days, um with clock times and im with months or seasons. Dates are ordinal numbers: am dritten Mai. In everyday German halb drei means 2:30, half an hour before three. Use clear clock times when arranging an appointment.", "example": "Der Termin ist am dritten Mai um halb drei.", "translation": "The appointment is on 3 May at half past two.", "questions": [{"q": "„Halb acht“ bedeutet …", "options": ["8:30", "7:30", "8:00"], "answer": 1, "why": "Halb acht is half an hour before eight: 7:30."}, {"q": "Wir treffen uns ___ Montag.", "options": ["am", "im", "um"], "answer": 0, "why": "Days use am: am Montag."}, {"q": "Der Kurs beginnt ___ neun Uhr.", "options": ["am", "im", "um"], "answer": 2, "why": "Clock times use um."}]}, {"title": "Confusing words: kennen, wissen & können", "cat": "Vocabulary practice", "group": "Everyday language", "rule": "Kennen means being familiar with a person, place or thing. Wissen means knowing a fact or answer. Können expresses ability or possibility. Bekommen means to receive, not to become; werden means to become.", "example": "Ich kenne die Stadt, aber ich weiß nicht, wo das Museum ist.", "translation": "I know the city, but I do not know where the museum is.", "questions": [{"q": "___ du die Antwort?", "options": ["Kennst", "Weißt", "Kannst"], "answer": 1, "why": "An answer is a fact: Weißt du die Antwort?"}, {"q": "Ich ___ meine Nachbarn gut.", "options": ["kenne", "weiß", "kann"], "answer": 0, "why": "Familiarity with people uses kennen."}, {"q": "Sie möchte Ärztin ___.", "options": ["bekommen", "wissen", "werden"], "answer": 2, "why": "To become is werden, not bekommen."}]}, {"title": "Useful everyday expressions", "cat": "Vocabulary practice", "group": "Everyday language", "rule": "Learn fixed expressions as complete units. Bescheid sagen means to let someone know. Die Daumen drücken means to wish someone luck. Es kommt darauf an means it depends. These are useful everyday phrases, not word-for-word translations.", "example": "Sag mir bitte Bescheid, wenn du angekommen bist.", "translation": "Please let me know when you have arrived.", "questions": [{"q": "„Ich drücke dir die Daumen!“ bedeutet …", "options": ["Ich wünsche dir Glück.", "Ich bin böse.", "Ich habe keine Zeit."], "answer": 0, "why": "Daumen drücken means to wish someone luck."}, {"q": "„Es kommt darauf an.“ bedeutet …", "options": ["It is arriving.", "It depends.", "It is finished."], "answer": 1, "why": "This fixed expression means it depends."}, {"q": "Bitte sag mir ___.", "options": ["Entscheid", "Unterschied", "Bescheid"], "answer": 2, "why": "Bescheid sagen means to let someone know."}]}, {"title": "Commas & capital letters", "cat": "Writing school", "group": "Writing school", "rule": "German nouns start with capitals. Separate main and subordinate clauses with commas, including relative clauses. A comma is required with infinitive groups introduced by um, ohne or statt. A formal email greeting is followed by a comma; the following word normally starts lowercase unless it is a noun or formal Sie.", "example": "Sehr geehrte Frau Meier,\nvielen Dank für Ihre Nachricht. Ich schreibe Ihnen, weil ich eine Frage habe.", "translation": "Dear Ms Meier, Thank you for your message. I am writing because I have a question.", "questions": [{"q": "Welche Schreibweise ist richtig?", "options": ["Ich lerne deutsch.", "Ich lerne Deutsch.", "ich lerne Deutsch."], "answer": 1, "why": "Deutsch names the language here and is written with a capital letter."}, {"q": "Wo steht das Komma?", "options": ["Ich bleibe, weil ich krank bin.", "Ich, bleibe weil ich krank bin.", "Ich bleibe weil, ich krank bin."], "answer": 0, "why": "The comma separates the main clause from the weil clause."}, {"q": "Welche Anrede ist formell?", "options": ["Hallo Leute!", "Na, du?", "Sehr geehrte Damen und Herren,"], "answer": 2, "why": "Sehr geehrte Damen und Herren is a formal greeting."}]}, {"title": "A polite email: structure & tone", "cat": "Writing school", "group": "Writing school", "rule": "Organise a practical email into a greeting, reason for writing, clear request and closing. Give enough detail for the reader to act. Use Sie/Ihnen/Ihr with capitals in formal correspondence. Polite requests often use könnten or wäre es möglich.", "example": "Könnten Sie mir bitte mitteilen, wann der nächste Kurs beginnt? Vielen Dank im Voraus.", "translation": "Could you please let me know when the next course starts? Thank you in advance.", "questions": [{"q": "Welche Bitte ist höflich und formell?", "options": ["Schick das sofort!", "Könnten Sie mir die Unterlagen schicken?", "Du musst das schicken."], "answer": 1, "why": "Könnten Sie makes a formal request polite."}, {"q": "Welche Schlussformel passt zu einer formellen E-Mail?", "options": ["Mit freundlichen Grüßen", "Bis dann, Kumpel", "Na los!"], "answer": 0, "why": "Mit freundlichen Grüßen is a standard formal closing."}, {"q": "Welche Schreibung ist bei formeller Anrede richtig?", "options": ["ich danke dir", "Ich danke ihnen", "Ich danke Ihnen"], "answer": 2, "why": "Formal Ihnen takes a capital letter."}]}, {"title": "A repair in the flat", "cat": "Reading", "group": "Housing", "rule": "Read the message and identify the problem, the proposed solution and the availability. Notice how a polite request gives specific details.", "example": "Sehr geehrter Herr Weber, seit gestern funktioniert die Heizung in meiner Wohnung nicht mehr. Im Schlafzimmer sind es nur sechzehn Grad. Ich habe versucht, Sie telefonisch zu erreichen, aber leider ohne Erfolg. Könnten Sie bitte einen Handwerker beauftragen? Am Mittwoch arbeite ich zu Hause und bin zwischen acht und zwölf Uhr erreichbar. Falls dieser Zeitraum nicht passt, kann meine Nachbarin am Donnerstag die Tür öffnen. Bitte teilen Sie mir mit, welcher Termin möglich ist. Mit freundlichen Grüßen, Nora Klein", "translation": "Nora’s heating has stopped working. She requests a repair and is available Wednesday morning. Her neighbour can open the door on Thursday if necessary.", "questions": [{"q": "Seit wann funktioniert die Heizung nicht?", "options": ["Seit gestern", "Seit Mittwoch", "Seit einem Monat"], "answer": 0, "why": "The opening says seit gestern."}, {"q": "Wann ist Nora zu Hause erreichbar?", "options": ["Mittwoch zwischen 8 und 12", "Donnerstagabend", "Jeden Tag nach 18 Uhr"], "answer": 0, "why": "She is working from home on Wednesday between eight and twelve."}, {"q": "Was kann die Nachbarin tun?", "options": ["Die Heizung bezahlen", "Am Donnerstag die Tür öffnen", "Nora anrufen"], "answer": 1, "why": "The neighbour can open the door on Thursday."}]}, {"title": "A new working week", "cat": "Reading", "group": "Work", "rule": "Read the announcement and distinguish fixed rules from optional activities. Pay attention to words such as müssen, dürfen and können.", "example": "Ab nächstem Monat dürfen die Mitarbeitenden unserer Firma an zwei Tagen pro Woche zu Hause arbeiten. Für die Planung muss jeder seine gewünschten Tage bis Freitag in den gemeinsamen Kalender eintragen. Dienstags findet weiterhin die Teamsitzung im Büro statt. Neue Mitarbeitende sollen im ersten Monat jeden Tag ins Büro kommen, damit sie das Team kennenlernen. Wer zu Hause keinen geeigneten Arbeitsplatz hat, kann weiterhin die ganze Woche im Büro arbeiten. Am Donnerstag bietet die Firma einen freiwilligen Kurs zum sicheren Umgang mit digitalen Daten an.", "translation": "The company allows two home-office days a week. Staff register days by Friday. Tuesday meetings remain in person, newcomers attend daily in their first month, and a Thursday data-security course is optional.", "questions": [{"q": "Wann findet die Teamsitzung statt?", "options": ["Montags", "Dienstags", "Freitags"], "answer": 1, "why": "The announcement specifies dienstags."}, {"q": "Wer soll zunächst täglich ins Büro kommen?", "options": ["Neue Mitarbeitende", "Alle Mitarbeitenden", "Nur die Kursleitung"], "answer": 0, "why": "New employees should attend daily in their first month."}, {"q": "Ist der Kurs am Donnerstag verpflichtend?", "options": ["Ja, für alle.", "Ja, für neue Mitarbeitende.", "Nein, er ist freiwillig."], "answer": 2, "why": "Freiwillig means voluntary."}]}, {"title": "A neighbourhood garden", "cat": "Reading", "group": "Community", "rule": "Read for opinions and cause-and-effect relationships. Find the sentence that supports each answer.", "example": "Auf einem leeren Grundstück in unserem Viertel entsteht ein Gemeinschaftsgarten. Früher lag dort oft Müll. Jetzt bauen die Nachbarn Gemüse an und teilen die Arbeit. Jeden Samstag treffen sie sich um zehn Uhr. Man braucht keine Erfahrung, denn erfahrene Mitglieder erklären die wichtigsten Aufgaben. Die Teil const {lessons,vocab}=DATA;let memory={};let storageOK=true;try{memory=JSON.parse(localStorage.getItem('klar-b1')||'{}')}catch{storageOK=false}let state=memory&&typeof memory==='object'&&!Array.isArray(memory)?memory:{};state.scores=state.scores||{};state.known=Array.isArray(state.known)?state.known:[];let section='Home',current=-1,word=0,revealed=false;
const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('klar-b1',JSON.stringify(state))}catch{storageOK=false}updateNav()}
function complete(i){return state.scores[i]===lessons[i].questions.length}

 const names=['Home','Grammar','Vocabulary','Reading','Listening','Writing school','Writing','Mixed practice','Contents','My progress'];
 document.getElementById('nav').innerHTML=names.map(n=>`<button class="${section===n?'active':''}" ${section===n?'aria-current="page"':''} onclick="go('${n}')">${n}</button>`).join('');
 const n=lessons.filter((_,i)=>complete(i)).length;
 document.getElementById('sideprogress').style.width=n/lessons.length*100+'%';
 document.getElementById('sidecount').textContent=`${n} / ${lessons.length} lessons mastered`;

}
function foot(){return '<footer>Klar Deutsch · Original B1-focused learning material with core revision. Not a complete B1 course or official exam. Not affiliated with Lingolia. Written content works offline; speech availability depends on your device.</footer>'}
function go(n){if('speechSynthesis'in window)speechSynthesis.cancel();section=n;current=-1;updateNav();render();window.scrollTo(0,0)}
function cards(list){return `<div class="grid lesson-cards">${list.map(l=>{let i=lessons.indexOf(l);return `<button class="card" data-title="${esc(l.title.toLowerCase())}" onclick="openLesson(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span> <span class="pill">${l.cat}</span><h3>${esc(l.title)}</h3><p>${esc(l.rule.split('. ')[0])}.</p><div class="card-foot"><span>${complete(i)?'✓ Mastered':state.scores[i]!=null?'Best: '+state.scores[i]+'/3':'3 practice questions · 8–12 min'}</span><span>Open lesson ↗</span></div></button>`}).join('')}</div>`}
function render(){
 if(section==='Home')renderHome();
 else if(['Grammar','Reading','Listening','Writing school','Vocabulary practice'].includes(section))renderCatalog(section);
 else if(section==='Vocabulary')renderVocabularyHome();
 else if(section==='Writing')renderWriting();
 else if(section==='Contents')renderContents();
 else if(section==='Mixed practice')renderMixed();
 else renderProgress();
 main.insertAdjacentHTML('beforeend',foot());
}
function renderHome(){
 let next=lessons.findIndex((_,i)=>!complete(i));if(next<0)next=0;
 const sections=[['Grammar','Make sense of the rules','Tenses, verbs, nouns, articles, pronouns, adjectives, prepositions and sentence structure.'],['Vocabulary','Find the words you need','Themed vocabulary, dates and times, confusing words and everyday expressions.'],['Reading','Understand everyday texts','Workplace notices, housing messages and community stories with comprehension questions.'],['Listening','Train your ear','Announcements, phone messages and everyday plans with transcripts and English summaries.'],['Writing school','Write with more clarity','Capital letters, commas, email structure and polite requests.'],['Writing','Put German into words','Practical writing prompts, useful phrases and a self-review checklist.']];
 main.innerHTML=`<section class="hero"><span class="eyebrow">Klar Deutsch · Offline learning library</span><h1>German B1: Learn. Practise. Understand.</h1><h2>A structured place for grammar, vocabulary and real-life German.</h2><p>Clear English explanations. German examples. Interactive exercises.<br>Build your confidence, one topic at a time.</p><div class="row"><span class="badge">${lessons.length} lessons</span><span class="badge">${lessons.reduce((n,l)=>n+l.questions.length,0)} questions</span><span class="badge">${vocab.length} vocabulary cards</span><span class="badge">Offline-ready</span></div><div class="actions" style="justify-content:center"><button class="primary" onclick="openLesson(${next})">Continue your learning →</button><button onclick="go('Contents')">Browse all topics</button></div><div class="hero-nav">${['Grammar','Vocabulary','Reading','Listening','Writing school','Mixed practice'].map(n=>`<button onclick="go('${n}')">${n}</button>`).join('')}</div></section><div class="callout"><h3>Your personal learning space</h3><p>Study without an account. Check answers immediately, review mistakes and keep your progress on this device. Use Export progress to make a backup.</p></div><div class="stats"><div class="stat"><strong>${lessons.filter((_,i)=>complete(i)).length} / ${lessons.length}</strong>Lessons mastered</div><div class="stat"><strong>${state.known.length} / ${vocab.length}</strong>Words learned</div><div class="stat"><strong>15 min</strong>A useful daily practice goal</div></div><div class="section-head"><h2>Explore your German library</h2><span class="small">B1 focus + core revision</span></div><div class="grid">${sections.map(([name,title,desc])=>`<button class="card" onclick="go('${name}')"><span class="eyebrow">${name}</span><h3>${title} ↗</h3><p>${desc}</p></button>`).join('')}</div><div class="panel"><h2>A simple daily workflow</h2><p><b>Learn:</b> choose a topic and read its explanation.<br><b>Practise:</b> answer questions and read the feedback.<br><b>Use it:</b> write two sentences or review a vocabulary theme.<br><b>Return:</b> revisit unfinished topics from My progress.</p><button onclick="go('Mixed practice')">Try a mixed review →</button></div>`;
}
function renderCatalog(cat){
 const list=lessons.filter(l=>l.cat===cat),groups=[...new Set(list.map(l=>l.group))];
 main.innerHTML=`<span class="eyebrow">Learning library · B1</span><h1>${esc(cat)}</h1><p class="small">${cat==='Grammar'?'Choose a grammar family, learn the rule, then practise with answer explanations. Core revision is included alongside B1 structures.':cat==='Listening'?'Original practical messages with browser-generated speech, German transcripts and English summaries. Offline audio needs an installed German voice.':'Read the explanation or text, answer the questions and check the evidence behind each answer.'}</p><input class="search" id="catalogSearch" aria-label="Search topics" placeholder="Search this section…" oninput="filterCatalog(this.value)"><div class="filter-row"><button onclick="selectGroup('')">All topics</button>${groups.map((g,i)=>`<button onclick="selectGroup(${i})">${esc(g)}</button>`).join('')}</div><div id="catalog">${groups.map(g=>`<section class="catalog-group" data-group="${esc(g.toLowerCase())}"><h2>${esc(g)}</h2>${cards(list.filter(l=>l.group===g))}</section>`).join('')}</div><p id="empty" hidden>No matching topics. Try another search.</p>`;
}
function selectGroup(i){const groups=[...new Set(lessons.filter(l=>l.cat===section).map(l=>l.group))];const input=document.getElementById('catalogSearch');input.value=i===''?'':groups[i];filterCatalog(input.value)}
function filterCatalog(value){const needle=value.toLowerCase();let total=0;document.querySelectorAll('.catalog-group').forEach(group=>{let count=0;group.querySelectorAll('.card').forEach(card=>{const show=group.dataset.group.includes(needle)||card.dataset.title.includes(needle);card.hidden=!show;if(show)count++});group.hidden=count===0;total+=count});document.getElementById('empty').hidden=total>0}

function filterContents(v){let total=0;document.querySelectorAll('.catalog-group').forEach(g=>{let n=0;g.querySelectorAll('.toc-link').forEach(b=>{b.hidden=!b.dataset.search.includes(v.toLowerCase());if(!b.hidden)n++});g.hidden=!n;total+=n});document.getElementById('empty').hidden=total>0}

function renderMixed(){
 const pool=lessons.flatMap((l,i)=>l.cat==='Grammar'||l.cat==='Vocabulary practice'?l.questions.map(q=>({...q,lesson:i})):[]);
 for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}

 main.innerHTML=`<span class="eyebrow">Review · not a placement test</span><h1>Mixed practice</h1><p>Ten questions from different topics. This review does not change your lesson scores. Follow the topic links to revisit the rules.</p><form id="mixedForm" class="panel" novalidate>${mixedQuestions.map((q,j)=>`<div class="question"><fieldset><legend>${j+1}. ${esc(q.q)}</legend>${q.options.map((o,k)=>`<label class="option"><input type="radio" name="m${j}" value="${k}">${esc(o)}</label>`).join('')}</fieldset><div id="mixed${j}" aria-live="polite"></div></div>`).join('')}<div class="actions"><button type="submit" class="primary">Check review</button><button type="button" onclick="renderMixed()">New questions</button></div><p id="mixedResult" role="status"></p></form>`;

}
function checkMixed(){let correct=0,answered=0;mixedQuestions.forEach((q,j)=>{let input=document.querySelector('#mixedForm input[name="m'+j+'"]:checked');let ok=input&&Number(input.value)===q.answer;if(input)answered++;if(ok)correct++;document.getElementById('mixed'+j).innerHTML=input?`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ Correct':'Correct answer: '+esc(q.options[q.answer])}</b><br>${esc(q.why)}<br><button type="button" onclick="openLesson(${q.lesson})">Review: ${esc(lessons[q.lesson].title)}</button></div>`:'<div class="feedback">Choose an answer first.</div>'});document.getElementById('mixedResult').textContent=`${correct} / ${mixedQuestions.length} correct · ${answered} answered. Review the explanations above.`}

function openLesson(i){current=i;state.last=i;save();let l=lessons[i];section=l.cat;updateNav();let listen=l.cat==='Listening';main.innerHTML=`<button onclick="go('${l.cat}')">← All ${l.cat.toLowerCase()}</button><p class="eyebrow">Lesson ${i+1} · ${l.cat} · B1</p><h1>${esc(l.title)}</h1><div class="panel"><h2>${listen?'Listen to the message':l.cat==='Reading'?'Read the story':'The idea'}</h2><p>${esc(l.rule)}</p>${listen?`<div class="actions"><button class="primary" onclick="speak(${i})">▶ Listen in German</button><button onclick="speechSynthesis.cancel()">Stop</button></div><p id="audioStatus" role="status" class="small"></p><details><summary>Show German transcript</summary><p lang="de">${esc(l.example)}</p></details>`:`<div class="example"><p lang="de"><b>${esc(l.example)}</b></p></div>`}<details><summary>English ${l.cat==='Grammar'?'translation':'summary'}</summary><p>${esc(l.translation)}</p></details></div><form id="quiz" class="panel" novalidate><span class="eyebrow">Put it into practice</span><h2>${listen?'What did you hear?':'Check your understanding'}</h2>${l.questions.map((q,j)=>`<div class="question"><fieldset><legend>${j+1}. ${esc(q.q)}</legend>${q.options.map((o,k)=>`<label class="option" lang="de"><input type="radio" name="q${j}" value="${k}">${esc(o)}</label>`).join('')}</fieldset><button type="button" onclick="checkQuestion(${i},${j})">Check this answer</button><div id="f${j}" aria-live="polite"></div></div>`).join('')}<div class="actions"><button class="primary" type="submit">Check answers</button><button type="button" onclick="openLesson(${i})">Try again</button></div><p id="result" role="status"></p></form>${i<lessons.length-1?`<button onclick="openLesson(${i+1})">Next lesson →</button>`:''}${foot()}`;document.getElementById('quiz').onsubmit=e=>{e.preventDefault();checkQuiz(i)};window.scrollTo(0,0)}

function questionResult(i,j){
 const q=lessons[i].questions[j];
 const selected=document.querySelector('#quiz input[name="q'+j+'"]:checked');
 const target=document.getElementById('f'+j);
 if(!selected){target.innerHTML='<div class="feedback">Choose an answer for this question first.</div>';return null}
 const ok=Number(selected.value)===q.answer;
 target.innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ Correct':'Not quite. Correct answer: '+esc(q.options[q.answer])}</b><br>${esc(q.why)}</div>`;
 return ok;
}
function checkQuestion(i,j){questionResult(i,j);document.getElementById('result').textContent='Use “Check answers” to check the whole lesson and save your score.'}
function checkQuiz(i){
 const results=lessons[i].questions.map((_,j)=>questionResult(i,j));
 const answered=results.filter(x=>x!==null).length,score=results.filter(x=>x===true).length;
 const result=document.getElementById('result');
 if(answered!==results.length){result.textContent=`${score} correct out of ${answered} answered. Answer the remaining ${results.length-answered} question(s) to save your lesson score.`;return}
 state.scores[i]=Math.max(state.scores[i]||0,score);save();
 result.textContent=`${score} / ${results.length} correct. ${score===results.length?'Lesson mastered!':'Read the feedback and try again. Your best score is saved.'}`;
}

function speak(i){let status=document.getElementById('audioStatus');if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable in this browser. Please use the transcript.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessons[i].example);u.lang='de-DE';u.rate=.85;let voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('de'));if(voice)u.voice=voice;status.textContent='Playing browser-generated German speech…';u.onend=()=>status.textContent='Finished. Listen again or answer the questions.';u.onerror=()=>status.textContent='Audio is unavailable. Use the German transcript below.';speechSynthesis.speak(u)}
function renderWords(){let v=vocab[word];main.innerHTML=`<button onclick="go('Vocabulary')">← Vocabulary overview</button><p class="eyebrow">${esc(v[3])} · word cards</p><h1>Words you’ll actually use.</h1><div class="panel flash"><span class="pill">Card ${wordPosition+1} / ${wordPool.length} ${state.known.includes(word)?'· ✓ Learned':''}</span><h2 lang="de">${esc(v[0])}</h2>${revealed?`<p>${esc(v[1])}</p><p lang="de"><i>${esc(v[2])}</i></p>`:'<p class="small">Can you recall the meaning?</p>'}<button class="primary" onclick="revealed=!revealed;renderWords()">${revealed?'Hide meaning':'Reveal meaning'}</button></div><div class="actions"><button onclick="moveWord(-1)">← Previous</button><button onclick="toggleKnown()">${state.known.includes(word)?'Mark for review':'✓ I know this word'}</button><button onclick="moveWord(1)">Next →</button></div><p class="small">${state.known.length} / ${vocab.length} words marked learned. Review any card as often as you like.</p>`}

function moveWord(n){wordPosition=(wordPosition+n+wordPool.length)%wordPool.length;word=wordPool[wordPosition];revealed=false;renderWords()}function toggleKnown(){state.known=state.known.includes(word)?state.known.filter(x=>x!==word):[...state.known,word];save();renderWords()}
const prompts=[['Request a repair','You rent a flat. The heating has not worked since Monday. Write to your landlord: explain the problem, describe its effect, ask for a repair appointment, and say when you are available.'],['Change an appointment','You cannot attend a language-course appointment. Write a polite email: apologise, give a reason, suggest two alternatives, and ask for confirmation.'],['Share your opinion','Should more people cycle to work? State your opinion, give two reasons, mention a possible problem, and finish with a recommendation.']];
function renderWriting(){let p=Number(state.prompt)||0;main.innerHTML=`<span class="eyebrow">Writing workshop</span><h1>Find your own words.</h1><p>Aim for 80–100 words as a practice goal. Your draft saves in this browser. Use the checklist for self-review; there is no automatic language grading.</p><div class="row">${prompts.map((x,i)=>`<button class="${i===p?'primary':''}" onclick="state.prompt=${i};save();renderWriting()">${esc(x[0])}</button>`).join('')}</div><div class="panel"><h2>${esc(prompts[p][0])}</h2><p>${esc(prompts[p][1])}</p><label for="draft" class="small">Your German draft</label><textarea id="draft" lang="de" placeholder="Sehr geehrte Frau …" oninput="saveDraft(this.value)">${esc(state['draft'+p]||'')}</textarea><p id="wordcount" class="small"></p><details><summary>Useful phrases</summary><p lang="de">Ich schreibe Ihnen, weil …<br>Leider kann ich …<br>Wäre es möglich, …?<br>Meiner Meinung nach …<br>Einerseits …, andererseits …<br>Ich freue mich auf Ihre Antwort.<br>Mit freundlichen Grüßen</p></details></div><div class="panel"><h2>Review your draft</h2>${['I covered every point in the prompt.','My greeting and tone fit the reader.','My conjugated verbs are in the right position.','I checked articles, cases and adjective endings.','I connected ideas with weil, obwohl or deshalb.'].map(t=>`<label style="display:block;margin:12px 0"><input type="checkbox"> ${t}</label>`).join('')}<button onclick="downloadDraft()">Download my draft</button></div>`;countWords(state['draft'+p]||'')}
function countWords(v){document.getElementById('wordcount').textContent=`${v.trim()?v.trim().split(/\s+/).length:0} words · Practice goal: 80–100`}
function saveDraft(v){state['draft'+(Number(state.prompt)||0)]=v;save();countWords(v)}
function downloadDraft(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([state['draft'+(Number(state.prompt)||0)]||''],{type:'text/plain;charset=utf-8'}));a.download='mein-deutscher-text.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderProgress(){main.innerHTML=`<span class="eyebrow">Your learning record</span><h1>See how far you’ve come.</h1><p>A lesson is mastered when you answer all three questions correctly. Your best score is retained.</p><div class="panel">${lessons.map((l,i)=>`<div class="section-head" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(l.title)}</span><button onclick="openLesson(${i})">${complete(i)?'✓ Mastered':state.scores[i]!=null?state.scores[i]+'/3 · Review':'Start →'}</button></div>`).join('')}</div><div class="panel"><h2>Back up your progress</h2><p>Export your scores, vocabulary marks and drafts before clearing browser data or changing devices. Import replaces the progress in this browser.</p><div class="actions"><button onclick="exportProgress()">Export progress</button><label class="option">Import progress <input type="file" accept=".json,application/json" onchange="importProgress(this)"></label></div><p id="backupStatus" role="status"></p><h2>Your next step</h2><p>Combine this practice with real conversations, longer reading, and feedback from a teacher or language partner.</p><button onclick="resetProgress()">Reset saved progress</button></div>`}

function exportProgress(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'klar-deutsch-b1',version:1,savedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'}));
 a.download='klar-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function validatedProgress(backup){
 if(!backup||backup.app!=='klar-deutsch-b1'||backup.version!==1)throw Error('Please choose a Klar Deutsch progress backup (version 1).');
 const p=backup.progress;
 if(!p||typeof p!=='object'||Array.isArray(p)||!p.scores||typeof p.scores!=='object'||Array.isArray(p.scores)||!Array.isArray(p.known))throw Error('This backup has invalid progress data.');
 const clean={scores:{},known:[]};
 for(const [key,value] of Object.entries(p.scores)){
  const i=Number(key);
  if(!Number.isInteger(i)||String(i)!==key||i<0||i>=lessons.length||!Number.isInteger(value)||value<0||value>lessons[i].questions.length)throw Error('This backup contains an invalid lesson score.');
  clean.scores[i]=value;
 }
 if(!p.known.every(i=>Number.isInteger(i)&&i>=0&&i<vocab.length))throw Error('This backup contains invalid vocabulary marks.');
 clean.known=[...new Set(p.known)];
 for(let i=0;i<3;i++){const key='draft'+i;if(p[key]!==undefined){if(typeof p[key]!=='string'||p[key].length>100000)throw Error('A writing draft is invalid or too long.');clean[key]=p[key]}}
 for(const [key,max] of [['prompt',3],['last',lessons.length]])if(p[key]!==undefined){if(!Number.isInteger(p[key])||p[key]<0||p[key]>=max)throw Error('This backup contains an invalid lesson selection.');clean[key]=p[key]}
 return clean;
}
async function importProgress(input){
 const status=document.getElementById('backupStatus'),file=input.files&&input.files[0];if(!file)return;
 try{
  if(file.size>1048576)throw Error('The backup must be smaller than 1 MB.');
  const clean=validatedProgress(JSON.parse(await file.text()));
  if(!confirm('Replace the saved progress and writing drafts in this browser with this backup?'))return;
  state=clean;save();renderProgress();
  document.getElementById('backupStatus').textContent=storageOK?'Progress restored successfully.':'Progress imported for this session, but browser storage is unavailable. Keep your backup file.';
 }catch(error){status.textContent='Import failed: '+error.message}
 input.value='';
}

function resetProgress(){if(confirm('Delete your lesson scores, vocabulary marks and writing drafts in this browser?')){state={scores:{},known:[]};save();render()}}
updateNav();render();
</script></body></html>
